<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Markeringer — Konventionstræner</title>
<link rel="canonical" href="https://www.kontraktbridge.dk/konventionstraener/markering.html">
<link rel="stylesheet" href="assets/fonts/tekst.css">
<link rel="stylesheet" href="assets/fonts/symboler.css">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/lang.js"></script>
<script src="assets/konventionskort-hint.js"></script>
<style>
  /* Markeringstræneren – samme opbygning som meldetræneren (traener.html), men med kort i stedet for meldeboks */
  .trainer{ max-width:64rem; padding-bottom:var(--sg-space-3xl); }
  .hero{ padding:var(--sg-space-2xl) 0 var(--sg-space-lg); margin-bottom:0; }
  .hero .eyebrow{ margin:0 0 var(--sg-space-xs); }
  .hero h1{ font-size:clamp(1.9rem,4.6vw,2.5rem); line-height:1; margin:0 0 var(--sg-space-sm); }
  .hero .deck{ font-size:1rem; line-height:1.5; }
  @media (max-width:600px){ .hero .deck{ display:none; } }

  .progress{ display:flex; gap:6px; margin:0 0 var(--sg-space-lg); }
  .progress i{ flex:1; height:6px; border-radius:var(--sg-radius-pill); background:var(--sg-hairline); position:relative; overflow:hidden; }
  .progress i.done::after, .progress i.current::after{ content:""; position:absolute; inset:0; background:var(--sg-primary); }
  .progress i.wrong::after{ background:var(--sg-negative-deep); }

  .board{ display:flex; flex-direction:column; gap:var(--sg-space-lg); }
  .play, .answer{ background:var(--sg-canvas); border-radius:var(--sg-radius-xl); padding:var(--sg-space-xl); }
  @media (max-width:600px){ .play, .answer{ padding:var(--sg-space-lg); } }
  @media (min-width:860px){ .board{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); align-items:start; } }

  .chips{ display:flex; flex-wrap:wrap; gap:var(--sg-space-xs); margin-bottom:var(--sg-space-lg); }
  .chip{ display:inline-block; font-size:.875rem; line-height:1.25rem; font-weight:600; color:var(--sg-ink); background:var(--sg-canvas-soft);
         padding:var(--sg-space-xs) var(--sg-space-md); border-radius:var(--sg-radius-pill); }
  .chip.mode{ background:var(--sg-primary-pale); }
  .ctx{ font-size:1rem; line-height:1.5; margin:0 0 var(--sg-space-lg); }

  /* Bridgebordet – BridgeTable fra designsystemet: Nord øverst, Syd nederst, Vest til venstre, Øst til højre,
     kompasset med N, Ø, S, V i midten. Ved hver plads står kortet, pladsen har spillet i stikket (med rækkefølgen). */
  .bt{ margin:0 0 var(--sg-space-sm); }
  .bt-grid{ display:grid; grid-template-columns:minmax(112px,auto) 112px minmax(112px,auto); grid-template-rows:auto minmax(112px,auto) auto;
            gap:var(--sg-space-lg); align-items:center; justify-items:center; justify-content:center; }
  .bt-info, .bt-notes{ align-self:start; justify-self:start; font-size:12px; line-height:16px; color:var(--sg-body); white-space:pre-line; }
  .bt-notes{ align-self:end; }
  .bt-seat{ display:flex; flex-direction:column; gap:var(--sg-space-xs); min-width:96px; padding:var(--sg-space-sm); border-radius:var(--sg-radius-md); }
  .bt-seat-N, .bt-seat-S{ justify-self:center; } .bt-seat-W{ justify-self:end; } .bt-seat-E{ justify-self:start; }
  .bt-seat.is-highlight{ background:var(--sg-primary-pale); }
  .bt-name{ font-size:12px; font-weight:600; line-height:16px; color:var(--sg-body); }
  .bt-compass{ position:relative; width:112px; height:112px; border-radius:var(--sg-radius-md); background:var(--sg-table); color:var(--sg-table-text); }
  .bt-letter{ position:absolute; display:inline-flex; align-items:center; justify-content:center; min-width:24px; height:24px;
              border-radius:var(--sg-radius-sm); font-size:14px; font-weight:600; line-height:20px; }
  .bt-letter-N{ top:4px; left:50%; transform:translateX(-50%); } .bt-letter-S{ bottom:4px; left:50%; transform:translateX(-50%); }
  .bt-letter-W{ left:4px; top:50%; transform:translateY(-50%); } .bt-letter-E{ right:4px; top:50%; transform:translateY(-50%); }
  .bt-hand{ display:flex; flex-direction:column; gap:2px; font-size:16px; line-height:24px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .bt-seat.is-highlight .bt-hand{ font-size:18px; line-height:26px; }
  .bt-line{ display:flex; align-items:baseline; gap:var(--sg-space-sm); }
  .bt-line .su{ width:1em; text-align:center; }
  .bt-cards{ font-weight:600; letter-spacing:.02em; } .bt-cards.is-void{ font-weight:400; color:var(--sg-body); }
  .bt-cards .c.played{ color:var(--sg-mute); font-weight:400; text-decoration:line-through; text-decoration-thickness:1px; }

  /* tidligere stik */
  .lbl{ font-size:.75rem; line-height:1rem; font-weight:600; color:var(--sg-body); margin:0 0 var(--sg-space-xs); }
  ol.hist{ list-style:none; margin:0 0 var(--sg-space-lg); padding:0; display:flex; flex-direction:column; gap:var(--sg-space-xs); }
  ol.hist li{ display:flex; flex-wrap:wrap; align-items:baseline; gap:var(--sg-space-xs) var(--sg-space-md); font-size:.875rem; line-height:1.4;
              background:var(--sg-canvas-soft); border-radius:var(--sg-radius-md); padding:var(--sg-space-sm) var(--sg-space-md); }
  ol.hist .n{ font-weight:600; }
  ol.hist .hc{ white-space:nowrap; font-weight:600; } ol.hist .hp{ font-weight:400; color:var(--sg-body); }
  ol.hist .win{ color:var(--sg-body); }
  .bt-play{ display:inline-flex; align-items:center; gap:var(--sg-space-xs); }
  .bt-play .ord{ font-size:12px; line-height:16px; font-weight:600; color:var(--sg-body); }
  .bt-play .bc{ font-size:1rem; min-width:2.6em; padding:.3em .4em; }
  .bt-play .bc.ask{ background:var(--sg-canvas-soft); border-color:transparent; color:var(--sg-body); }
  .bt-play .bc.part{ box-shadow:inset 0 0 0 2px var(--sg-ink); border-color:transparent; }
  @media (max-width:520px){
    .bt-grid{ grid-template-columns:minmax(0,auto) 72px minmax(0,auto); grid-template-rows:auto minmax(72px,auto) auto; gap:var(--sg-space-sm); }
    .bt-compass{ width:72px; height:72px; }
    .bt-seat{ min-width:0; padding:var(--sg-space-xs) var(--sg-space-sm); }
    .bt-hand, .bt-seat.is-highlight .bt-hand{ font-size:15px; line-height:22px; }
    .bt-info, .bt-notes{ font-size:11px; }
  }

  .qrow{ display:flex; align-items:center; justify-content:space-between; gap:var(--sg-space-md); margin:0 0 var(--sg-space-md); }
  .qtext{ font-weight:600; font-size:1.125rem; line-height:1.4; margin:0; }
  .hint-btn{ background:var(--sg-canvas-soft); border:0; color:var(--sg-ink); border-radius:var(--sg-radius-pill); width:2.5rem; height:2.5rem;
             font-size:1.05rem; cursor:pointer; flex:none; }
  .hint-btn:hover{ box-shadow:inset 0 0 0 1px var(--sg-ink); }
  .hint-btn[aria-pressed="true"]{ background:var(--sg-primary); color:var(--sg-on-primary); }
  .hintinfo{ font-size:.9375rem; line-height:1.45; color:var(--sg-ink); background:var(--sg-primary-pale);
             border-radius:var(--sg-radius-md); padding:var(--sg-space-sm) var(--sg-space-lg); margin:0 0 var(--sg-space-md); display:none; }
  .hintinfo.show{ display:block; }

  .cardrow{ display:flex; flex-wrap:wrap; gap:var(--sg-space-sm); margin-bottom:var(--sg-space-sm); }
  .card{ font:600 1.15rem/1 var(--sg-sans); min-width:3.2rem; padding:.7rem .6rem; background:var(--sg-canvas-soft); color:var(--sg-ink);
         border:0; border-radius:var(--sg-radius-md); cursor:pointer; }
  .card .su{ font-size:1.15em; margin-right:.08em; }
  .opt{ display:block; width:100%; font:400 1rem/1.4 var(--sg-sans); text-align:left; background:var(--sg-canvas-soft); color:var(--sg-ink); border:0;
        border-radius:var(--sg-radius-md); padding:var(--sg-space-md) var(--sg-space-lg); margin-bottom:var(--sg-space-sm); cursor:pointer; }
  .card:hover:not(:disabled), .opt:hover:not(:disabled){ box-shadow:inset 0 0 0 1px var(--sg-ink); }
  .card:disabled, .opt:disabled{ cursor:default; opacity:.45; }
  .card.correct, .opt.correct{ opacity:1; background:var(--sg-primary-pale); color:var(--sg-positive-deep); box-shadow:inset 0 0 0 2px var(--sg-positive-deep); }
  .card.incorrect, .opt.incorrect{ opacity:1; background:var(--sg-canvas); color:var(--sg-negative-deep); box-shadow:inset 0 0 0 2px var(--sg-negative-deep); }

  .feedback{ margin-top:var(--sg-space-md); padding:var(--sg-space-lg); border-radius:var(--sg-radius-lg); font-size:.9375rem; line-height:1.5; display:none; }
  .feedback.show{ display:block; }
  .feedback.ok{ background:var(--sg-primary-pale); } .feedback.no{ background:var(--sg-canvas-soft); }
  .feedback b{ display:block; margin-bottom:var(--sg-space-xs); font-weight:600; }
  .feedback.ok b{ color:var(--sg-positive-deep); } .feedback.no b{ color:var(--sg-negative-deep); }

  .next{ margin-top:var(--sg-space-sm); display:none; width:100%; max-width:19rem; background:var(--sg-primary); color:var(--sg-on-primary); border:0;
         border-radius:var(--sg-radius-xl); padding:var(--sg-space-md) var(--sg-space-xl); font:600 1rem/1.5 var(--sg-sans); cursor:pointer; }
  .next:hover{ background:var(--sg-primary-active); }
  .next.show{ display:block; }

  div.done{ text-align:center; background:var(--sg-canvas); border-radius:var(--sg-radius-xl); padding:var(--sg-space-3xl) var(--sg-space-xl); }
  div.done .score{ font-family:var(--sg-display); font-weight:800; font-size:clamp(3rem,10vw,5rem); line-height:1; letter-spacing:-.02em; margin:var(--sg-space-md) 0; }
  div.done .actions{ display:flex; gap:var(--sg-space-sm); justify-content:center; flex-wrap:wrap; margin-top:var(--sg-space-xl); }
  .btn{ font:600 1rem/1.5 var(--sg-sans); border-radius:var(--sg-radius-xl); padding:var(--sg-space-md) var(--sg-space-xl); cursor:pointer; text-decoration:none;
        border:0; background:var(--sg-canvas-soft); color:var(--sg-ink); }
  .btn:hover{ box-shadow:inset 0 0 0 1px var(--sg-ink); }
  .btn.primary{ background:var(--sg-primary); color:var(--sg-on-primary); }
  .btn.primary:hover{ background:var(--sg-primary-active); box-shadow:none; }
  .source{ margin-top:var(--sg-space-lg); }
</style>
</head>
<body>
<header id="topbjaelke" data-aktiv="traen" data-sprog></header>
<script src="assets/topbar.js"></script>

<div class="wrap trainer">
  <section class="hero">
    <p class="eyebrow" id="group"></p>
    <h1 id="title" data-en="Signals">Markeringer</h1>
    <p class="deck" id="desc"></p>
  </section>

  <div class="progress" id="progress"></div>

  <div class="board" id="board">
    <div class="play">
      <div class="chips"><span class="chip" id="role"></span><span class="chip mode" id="mode"></span><span class="chip" id="sitname"></span></div>
      <p class="ctx" id="ctx"></p>
      <div id="hist"></div>
      <figure class="bt" id="table"></figure>
      <button class="next" id="nextBtn" data-en="Next hand →">Næste hånd →</button>
    </div>
    <div class="answer">
      <div class="qrow">
        <p class="qtext" id="q"></p>
        <button class="hint-btn" id="hintBtn" title="Vis reglen" data-en-title="Show the rule" aria-pressed="false">💡</button>
      </div>
      <div class="hintinfo" id="hintInfo"></div>
      <div id="opts"></div>
      <div class="feedback" id="feedback"></div>
    </div>
  </div>

  <p class="small source" id="source"></p>
</div>

<script>
const SYM = { S: '♠', H: '♥', D: '♦', C: '♣' };
const RN = T({ 14: 'E', 13: 'K', 12: 'D', 11: 'B' }, { 14: 'A', 13: 'K', 12: 'Q', 11: 'J' });
const ROUND_SIZE = 8;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const suitSpan = s => `<span class="su ${s === 'H' || s === 'D' ? 'su-h' : 'su-s'}">${SYM[s]}</span>`;
const cardHtml = c => suitSpan(c[0]) + (RN[+c.slice(1)] || c.slice(1));
// Fritekst fra puljen: escapes og farver kulørsymbolerne
const suits = t => esc(t).replace(/[♠♥♦♣]/g, c => `<span class="su ${c === '♥' || c === '♦' ? 'su-h' : 'su-s'}">${c}</span>`);
// En hånd som fire linjer ♠ ♥ ♦ ♣ (BridgeHand): honnører E K D B (på engelsk A K Q J), renonce som —. Spillede kort står gråtonet og overstreget.
const handHtml = (h, played) => `<div class="bt-hand">${'SHDC'.split('').map(s =>
  `<div class="bt-line">${suitSpan(s)}<span class="bt-cards${h[s].length ? '' : ' is-void'}">${h[s].length
    ? h[s].map(r => `<span class="c${played.has(s + r) ? ' played' : ''}">${RN[r] || r}</span>`).join('') : '—'}</span></div>`).join('')}</div>`;
const SEAT = { Nord: 'N', 'Øst': 'E', Syd: 'S', Vest: 'W' };
const LETTER = T({ N: 'N', E: 'Ø', S: 'S', W: 'V' }, { N: 'N', E: 'E', S: 'S', W: 'W' });

// Bridgebordet (BridgeTable): bordet og din hånd vises, makker og spilfører er skjult; ved hver plads står kortet i stikket
function tableHtml(q){
  const partner = q.du === 'Øst' ? 'Vest' : 'Øst';
  const role = T({ Nord: 'bordet', Syd: 'spilfører', [q.du]: 'dig', [partner]: 'makker' },
                 { Nord: 'dummy', Syd: 'declarer', [q.du]: 'you', [partner]: 'partner' });
  const plays = {};
  q.stik.forEach(([p, c], i) => { plays[p] = { c, i: i + 1 }; });
  const played = new Set(q.spillet || []);
  const seat = p => {
    const hand = p === 'Nord' ? q.bordet : p === q.du ? q.haand : null;
    const pl = plays[p];
    let play = '';
    if (pl) play = `<span class="bt-play"><span class="ord">${pl.i}.</span><span class="bc${q.mode === 'laes' && p === partner ? ' part' : ''}">${cardHtml(pl.c)}</span></span>`;
    else if (q.mode === 'giv' && p === q.du) play = `<span class="bt-play"><span class="ord">${q.stik.length + 1}.</span><span class="bc ask">?</span></span>`;
    return `<div class="bt-seat bt-seat-${SEAT[p]}${p === q.du ? ' is-highlight' : ''}"><span class="bt-name">${W(p)} · ${role[p]}</span>${hand ? handHtml(hand, played) : ''}${play}</div>`;
  };
  const nr = (q.historik || []).length + 1;
  const letter = k => `<span class="bt-letter bt-letter-${k}">${LETTER[k]}</span>`;
  return `<div class="bt-grid">`
    + `<div class="bt-info">${T('Spilfører: Syd\nBordet: Nord', 'Declarer: South\nDummy: North')}</div>${seat('Nord')}<div></div>`
    + `${seat('Vest')}<div class="bt-compass" role="img" aria-label="${T('Bridgebord: Nord, Øst, Syd, Vest', 'Bridge table: North, East, South, West')}">${letter('N')}${letter('W')}${letter('E')}${letter('S')}</div>${seat('Øst')}`
    + `<div></div>${seat('Syd')}<div class="bt-notes">${suits(T('Kontrakt: ' + q.kontrakt + ' af Syd', 'Contract: ' + q.kontrakt + ' by South'))}\n${T(nr + '. stik', 'Trick ' + nr)}</div>`
    + `</div>`;
}

// De stik, der er spillet før stikket nu
function historyHtml(q){
  const h = q.historik || [];
  if (!h.length) return '';
  const partner = q.du === 'Øst' ? 'Vest' : 'Øst';
  const who = p => p === q.du ? T('dig', 'you') : p === partner ? T('makker', 'partner') : p === 'Nord' ? T('bordet', 'dummy') : T('spilfører', 'declarer');
  return `<p class="lbl">${T('Tidligere stik', 'Previous tricks')}</p><ol class="hist">${h.map((t, i) =>
    `<li><span class="n">${T(`${i + 1}. stik`, `Trick ${i + 1}`)}</span>${t.kort.map(([p, c]) => `<span class="hc"><span class="hp">${W(p)}</span> ${cardHtml(c)}</span>`).join('')}`
    + `<span class="win">– ${W(t.vinder)} (${who(t.vinder)}) ${T('vinder', 'wins')}</span></li>`).join('')}</ol>`;
}
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

let POOL = null, SITS = {}, Q = [], idx = 0, score = 0, results = [], answered = false, backLink = './#traen';

function renderProgress(){
  $('progress').innerHTML = Q.map((_, i) => `<i class="${i < results.length ? (results[i] ? 'done' : 'done wrong') : i === idx ? 'current' : ''}"></i>`).join('');
}

function render(){
  answered = false;
  const q = Q[idx];
  renderProgress();
  $('role').textContent = T(`Du er ${q.du}`, `You are ${W(q.du)}`);
  $('mode').textContent = q.mode === 'giv' ? T('Giv markering', 'Give the signal') : T('Læs markering', 'Read the signal');
  $('sitname').textContent = (SITS[q.situation] || {}).titel || '';
  $('ctx').innerHTML = suits(q.tekst);
  $('hist').innerHTML = historyHtml(q);
  $('table').innerHTML = tableHtml(q);
  $('q').innerHTML = suits(q.spm);

  $('hintBtn').setAttribute('aria-pressed', 'false');
  $('hintInfo').className = 'hintinfo';
  $('hintInfo').innerHTML = suits((SITS[q.situation] || {}).regel || '');

  const opts = $('opts');
  if (q.mode === 'giv'){
    const by = {};
    q.valg.forEach(c => (by[c[0]] = by[c[0]] || []).push(c));
    opts.innerHTML = 'SHDC'.split('').filter(s => by[s]).map(s =>
      `<div class="cardrow">${by[s].map(c => `<button class="card" data-c="${c}">${cardHtml(c)}</button>`).join('')}</div>`).join('');
  } else {
    opts.innerHTML = q.valg.map(v => `<button class="opt" data-c="${esc(v)}">${suits(v)}</button>`).join('');
  }
  opts.querySelectorAll('button').forEach(b => b.addEventListener('click', () => choose(b)));

  $('feedback').className = 'feedback';
  $('feedback').innerHTML = '';
  $('nextBtn').className = 'next';
}

function choose(btn){
  if (answered) return;
  answered = true;
  const q = Q[idx];
  const ok = q.rigtige.includes(btn.dataset.c);
  results[idx] = ok;
  if (ok) score++;
  $('opts').querySelectorAll('button').forEach(b => {
    if (q.rigtige.includes(b.dataset.c)) b.classList.add('correct');
    b.disabled = true;
  });
  if (!ok) btn.classList.add('incorrect');
  const facit = q.mode === 'giv' ? q.rigtige.map(cardHtml).join(T(' eller ', ' or ')) : suits(q.rigtige[0]);
  $('feedback').className = 'feedback show ' + (ok ? 'ok' : 'no');
  $('feedback').innerHTML = `<b>${ok ? T('Rigtigt — ', 'Correct — ') : T('Facit: ', 'Answer: ')}${facit}</b>${suits(q.hvorfor)}`;
  $('nextBtn').className = 'next show';
  $('nextBtn').textContent = idx === Q.length - 1 ? T('Se resultat →', 'See the result →') : T('Næste hånd →', 'Next hand →');
  renderProgress();
}

$('hintBtn').addEventListener('click', () => {
  const on = $('hintBtn').getAttribute('aria-pressed') !== 'true';
  $('hintBtn').setAttribute('aria-pressed', on ? 'true' : 'false');
  $('hintInfo').className = on ? 'hintinfo show' : 'hintinfo';
});

$('nextBtn').addEventListener('click', () => {
  idx++;
  if (idx >= Q.length){ renderDone(); return; }
  render();
});

function renderDone(){
  $('board').style.display = 'block';
  $('board').innerHTML = `
    <div class="done">
      <p class="qtext">${T('Du klarede', 'You got')}</p>
      <div class="score">${score} / ${Q.length}</div>
      <p>${score === Q.length ? T('Markeringerne sidder.', 'The signals have stuck.') : T('Gennemgå forklaringerne igen, og prøv en gang til.', 'Go through the explanations again and have another go.')}</p>
      <div class="actions">
        <button class="btn primary" id="restartBtn">${T('Ny omgang', 'New round')}</button>
        <a class="btn" href="${backLink}">${T('Vælg konvention', 'Choose a convention')}</a>
      </div>
    </div>`;
  $('restartBtn').addEventListener('click', () => location.reload());
}

// "Senest trænet" på forsiden: højst tre konventioner, nyeste først, uden dubletter
function remember(k){
  try {
    const a = JSON.parse(localStorage.getItem('senest') || '[]');
    localStorage.setItem('senest', JSON.stringify([k].concat(Array.isArray(a) ? a.filter(x => x !== k) : []).slice(0, 3)));
  } catch (e) {}
}
function fail(msg){
  $('board').innerHTML = `<p class="qtext">${msg}</p><p class="small"><a href="./#traen">${T('← Tilbage til konventionerne', '← Back to the conventions')}</a></p>`;
}

const id = new URLSearchParams(location.search).get('k') || 'markeringer';
Promise.all(['data/konventioner.json', 'data/systemer.json'].map(u => fetch(u).then(r => r.json())))
  .then(([list, systems]) => {
    list = L(list); systems = L(systems);
    const k = list.find(x => x.id === id);
    if (!k || k.status !== 'klar' || k.side !== 'markering.html') throw new Error('ukendt');
    const ids = Array.isArray(k.system) ? k.system : [k.system];
    const names = ids.map(x => (systems.find(s => s.id === x) || {}).navn).filter(Boolean);
    document.title = `${k.titel} — Konventionstræner`;
    $('group').innerHTML = suits(k.gruppe);
    $('title').innerHTML = suits(k.titel);
    $('desc').innerHTML = suits(k.beskrivelse);
    // ⓘ ved titlen, når konventionen har et konventionskort (SPEC-konventionskort, Afklaret 5)
    konventionskortHint(k.id, $('title'), $('desc'));
    $('source').innerHTML = k.viden
      ? T(`Aftalerne står i <a href="${esc(k.viden)}">systemet for ${esc(names[0])}</a>, afsnit 9.`,
          `The agreements are in <a href="${esc(k.viden)}">the system for ${esc(names[0])}</a>, section 9 (in Danish).`)
      : T('Reglerne følger <a href="viden/2-over-1-makker2.html#afsnit-20">beskrivelsen hos Makker 2 &amp; mig</a>: højt beder om den højeste af de to farver, lavt om den laveste.',
          'The rules follow <a href="viden/2-over-1-makker2.html#afsnit-20">the description for Partner 2 &amp; me</a> (in Danish): high asks for the higher of the two suits, low for the lower.');
    return fetch(`pools/${k.id}.json`).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  })
  .then(pool => {
    POOL = L(pool); SITS = POOL.situations;
    Q = shuffle(POOL.hands).slice(0, ROUND_SIZE);
    remember(id);
    render();
  })
  .catch(e => fail(e.message === 'ukendt'
    ? T('Den træner findes ikke – eller den er ikke klar endnu.', 'That trainer does not exist – or it is not ready yet.')
    : T('Kunne ikke hente hånd-puljen. Åbn siden via GitHub Pages eller en lokal webserver — ikke direkte som fil.',
        'Could not load the hand pool. Open the page via GitHub Pages or a local web server — not directly as a file.')));
</script>

<script src="assets/footer.js"></script>
