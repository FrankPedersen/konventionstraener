<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Træning — Konventionstræner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Manrope:wght@800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Symbols+2&text=%E2%99%A0%E2%99%A5%E2%99%A6%E2%99%A3&display=swap">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/lang.js"></script>
<style>
  .trainer{ max-width:64rem; padding-bottom:var(--sg-space-3xl); }
  .hero{ padding:var(--sg-space-2xl) 0 var(--sg-space-lg); margin-bottom:0; }
  .hero .eyebrow{ margin:0 0 var(--sg-space-xs); }
  .hero h1{ font-size:clamp(1.9rem,4.6vw,2.5rem); line-height:1; margin:0 0 var(--sg-space-sm); }
  .hero .deck{ font-size:1rem; line-height:1.5; }
  @media (max-width:600px){ .hero .deck{ display:none; } }

  .progress{ display:flex; gap:6px; margin:0 0 var(--sg-space-lg); }
  .progress i{ flex:1; height:6px; border-radius:var(--sg-radius-pill); background:var(--sg-hairline); position:relative; overflow:hidden; }
  .progress i.done::after, .progress i.current::after{ content:""; position:absolute; inset:0; background:var(--sg-primary); }
  .progress i.wrong::after{ background:var(--sg-negative-deep); }

  .board{ display:flex; flex-direction:column; gap:var(--sg-space-lg); }
  .play, .bidding, .bonus{ background:var(--sg-canvas); border-radius:var(--sg-radius-xl); padding:var(--sg-space-xl); }
  @media (max-width:600px){ .play, .bidding, .bonus{ padding:var(--sg-space-lg); } }
  @media (min-width:860px){
    .board{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.1fr); grid-template-areas:"play bid" "play bonus";
            align-items:start; gap:var(--sg-space-lg); }
    .play{ grid-area:play; } .bidding{ grid-area:bid; } .bonus{ grid-area:bonus; }
  }
  .rolechip{ display:inline-block; font-size:.875rem; line-height:1.25rem; font-weight:600; color:var(--sg-ink); background:var(--sg-canvas-soft);
             padding:var(--sg-space-xs) var(--sg-space-md); border-radius:var(--sg-radius-pill); margin-bottom:var(--sg-space-lg); }

  .auction{ display:flex; flex-wrap:wrap; gap:var(--sg-space-sm) var(--sg-space-md); align-items:flex-end; margin-bottom:var(--sg-space-lg); }
  .auction .slot{ display:flex; flex-direction:column; align-items:center; gap:var(--sg-space-xs); }
  .auction .who{ font-size:.75rem; line-height:1rem; color:var(--sg-body); }
  .auction .bc{ font-size:1rem; min-width:2.6em; padding:.35em .4em; }
  .auction .bc.them{ opacity:.7; }
  .auction .bc.ask{ background:var(--sg-canvas-soft); border-color:transparent; color:var(--sg-body); }

  .sitnote{ font-size:.875rem; color:var(--sg-body); margin:calc(-1 * var(--sg-space-sm)) 0 var(--sg-space-md); }
  .sitnote:empty{ display:none; }
  .hand{ max-width:19rem; background:var(--sg-canvas-soft); border-radius:var(--sg-radius-lg);
         padding:var(--sg-space-md) var(--sg-space-lg); font-size:1.4rem; font-weight:600; line-height:1.45; }
  .hand .row{ display:flex; align-items:center; gap:.65rem; }
  .hand .s{ width:1.25em; text-align:center; font-family:var(--sg-sym); font-weight:400; font-size:1.3em; line-height:1; }

  .bonus .label{ font-size:.75rem; line-height:1rem; font-weight:600; color:var(--sg-body); margin:0 0 var(--sg-space-sm); }
  .bonus .bq{ font-size:1rem; line-height:1.5; margin:0 0 var(--sg-space-md); }
  .bonus .opts{ display:grid; gap:var(--sg-space-sm); }
  .bopt{ font:400 .9375rem/1.4 var(--sg-sans); text-align:left; background:var(--sg-canvas-soft); color:var(--sg-ink); border:0;
         border-radius:var(--sg-radius-md); padding:var(--sg-space-md) var(--sg-space-lg); cursor:pointer; }
  .bopt:hover:not(:disabled){ box-shadow:inset 0 0 0 1px var(--sg-ink); }
  .bopt:disabled{ cursor:default; }
  .bopt.correct, .cell.correct{ background:var(--sg-primary-pale); color:var(--sg-positive-deep); box-shadow:inset 0 0 0 2px var(--sg-positive-deep); }
  .bopt.incorrect, .cell.incorrect{ background:var(--sg-canvas); color:var(--sg-negative-deep); box-shadow:inset 0 0 0 2px var(--sg-negative-deep); }
  .bfeedback{ margin-top:var(--sg-space-md); font-size:.875rem; line-height:1.45; color:var(--sg-body); display:none; }
  .bfeedback.show{ display:block; }

  .qrow{ display:flex; align-items:center; justify-content:space-between; gap:var(--sg-space-md); margin:0 0 var(--sg-space-md); }
  .qtext{ font-weight:600; font-size:1.125rem; margin:0; }
  .hint-btn{ background:var(--sg-canvas-soft); border:0; color:var(--sg-ink); border-radius:var(--sg-radius-pill); width:2.5rem; height:2.5rem;
             font-size:1.05rem; cursor:pointer; flex:none; }
  .hint-btn:hover{ box-shadow:inset 0 0 0 1px var(--sg-ink); }
  .hint-btn[aria-pressed="true"]{ background:var(--sg-primary); color:var(--sg-on-primary); }
  .hintinfo{ max-width:19rem; font-size:1rem; font-weight:600; color:var(--sg-ink); background:var(--sg-primary-pale);
             border-radius:var(--sg-radius-md); padding:var(--sg-space-sm) var(--sg-space-lg); margin:var(--sg-space-md) 0 0; display:none; }
  .hintinfo.show{ display:block; }

  .box{ display:grid; grid-template-columns:repeat(5,1fr); gap:4px; margin-bottom:4px; }
  .specialrow{ display:grid; grid-template-columns:repeat(3,1fr); gap:4px; }
  .cell{ font:600 .9rem/1.2 var(--sg-sans); background:var(--sg-canvas-soft); color:var(--sg-ink);
         border:0; border-radius:var(--sg-radius-sm); padding:.45rem .1rem; cursor:pointer; }
  .cell:hover:not(:disabled){ box-shadow:inset 0 0 0 1px var(--sg-ink); }
  .cell:disabled{ opacity:.35; cursor:default; }
  .cell.correct, .cell.incorrect{ opacity:1; }
  .cell.hinted:not(:disabled){ background:var(--sg-primary-pale); box-shadow:inset 0 0 0 2px var(--sg-ink); }
  .cell.pas{ background:var(--bid-pas); color:#fff; }
  .cell.dbl{ background:var(--bid-dbl); color:#fff; }
  .cell.pas.hinted:not(:disabled), .cell.dbl.hinted:not(:disabled){ color:#fff; box-shadow:0 0 0 2px var(--sg-canvas), 0 0 0 4px var(--sg-ink); }
  .cell.pas.hinted:not(:disabled){ background:var(--bid-pas); } .cell.dbl.hinted:not(:disabled){ background:var(--bid-dbl); }
  .cell.pas.correct, .cell.dbl.correct{ color:#fff; box-shadow:0 0 0 2px var(--sg-canvas), 0 0 0 4px var(--sg-positive-deep); }
  .cell.pas.correct{ background:var(--bid-pas); } .cell.dbl.correct{ background:var(--bid-dbl); }
  .cell.pas.incorrect, .cell.dbl.incorrect{ color:#fff; box-shadow:0 0 0 2px var(--sg-canvas), 0 0 0 4px var(--sg-negative-deep); }
  .cell.pas.incorrect{ background:var(--bid-pas); } .cell.dbl.incorrect{ background:var(--bid-dbl); }

  .feedback{ margin-top:var(--sg-space-lg); padding:var(--sg-space-lg); border-radius:var(--sg-radius-lg); font-size:.9375rem; line-height:1.5; display:none; }
  .feedback.show{ display:block; }
  .feedback.ok{ background:var(--sg-primary-pale); color:var(--sg-ink); }
  .feedback.no{ background:var(--sg-canvas-soft); color:var(--sg-ink); }
  .feedback b{ display:block; margin-bottom:var(--sg-space-xs); font-weight:600; }
  .feedback.ok b{ color:var(--sg-positive-deep); } .feedback.no b{ color:var(--sg-negative-deep); }

  .next{ margin-top:var(--sg-space-lg); display:none; width:100%; max-width:19rem; background:var(--sg-primary); color:var(--sg-on-primary); border:0;
         border-radius:var(--sg-radius-xl); padding:var(--sg-space-md) var(--sg-space-xl); font:600 1rem/1.5 var(--sg-sans); cursor:pointer; }
  .next:hover{ background:var(--sg-primary-active); }
  .next.show{ display:block; }

  div.done{ text-align:center; background:var(--sg-canvas); border-radius:var(--sg-radius-xl); padding:var(--sg-space-3xl) var(--sg-space-xl); }
  div.done .score{ font-family:var(--sg-display); font-weight:800; font-size:clamp(3rem,10vw,5rem); line-height:1; letter-spacing:-.02em; color:var(--sg-ink); margin:var(--sg-space-md) 0; }
  div.done .actions{ display:flex; gap:var(--sg-space-sm); justify-content:center; flex-wrap:wrap; margin-top:var(--sg-space-xl); }
  .btn{ font:600 1rem/1.5 var(--sg-sans); border-radius:var(--sg-radius-xl); padding:var(--sg-space-md) var(--sg-space-xl); cursor:pointer; text-decoration:none;
        border:0; background:var(--sg-canvas-soft); color:var(--sg-ink); }
  .btn:hover{ box-shadow:inset 0 0 0 1px var(--sg-ink); }
  .btn.primary{ background:var(--sg-primary); color:var(--sg-on-primary); }
  .btn.primary:hover{ background:var(--sg-primary-active); box-shadow:none; }
  .source{ margin-top:var(--sg-space-lg); }

  /* profilvalg (Kampen om kontrakten) */
  .profiles{ display:none; gap:var(--sg-space-sm); align-items:center; flex-wrap:wrap; font-size:.875rem; margin:var(--sg-space-sm) 0 0; }
  .profiles.show{ display:flex; }
  .profiles .lbl{ color:var(--sg-body); margin-right:var(--sg-space-xs); }
  .profiles button{ font:600 .875rem/1.25rem var(--sg-sans); border:0; background:var(--sg-canvas); color:var(--sg-ink);
                    border-radius:var(--sg-radius-pill); padding:var(--sg-space-sm) var(--sg-space-lg); cursor:pointer; }
  .profiles button:hover{ box-shadow:inset 0 0 0 1px var(--sg-ink); }
  .profiles button[aria-pressed="true"]{ background:var(--sg-ink); color:var(--sg-canvas); }

  /* valg af metode inden runden (fx forsvar mod 1NT) */
  .chooser{ margin:var(--sg-space-lg) 0 var(--sg-space-2xl); }
  .chooser h2{ font-size:1.5rem; margin:0 0 var(--sg-space-lg); }
  .chooser .opts3{ display:grid; grid-template-columns:repeat(auto-fit,minmax(13rem,1fr)); gap:var(--sg-space-lg); }
  .chooser button{ display:flex; flex-direction:column; justify-content:flex-start; gap:var(--sg-space-sm); text-align:left; font:inherit; background:var(--sg-canvas); border:0;
                   border-radius:var(--sg-radius-xl); padding:var(--sg-space-xl); cursor:pointer; color:var(--sg-ink); }
  .chooser button:hover, .chooser button:focus-visible{ box-shadow:inset 0 0 0 1px var(--sg-ink); }
  .chooser button b{ display:block; font-size:1.25rem; font-weight:600; letter-spacing:-.01em; color:var(--sg-ink); }
  .chooser button span{ font-size:.9375rem; line-height:1.45; color:var(--sg-body); }
  .chooser button.last{ background:var(--sg-primary-pale); }
  .chooser .lastnote{ font-size:.75rem; line-height:1rem; font-weight:600; color:var(--sg-ink); }
  .switch{ font-size:.875rem; margin:var(--sg-space-sm) 0 0; }
  .aftale{ display:inline-block; font-size:.75rem; line-height:1rem; font-weight:600; color:var(--sg-ink); background:var(--sg-primary-pale);
           border-radius:var(--sg-radius-pill); padding:var(--sg-space-xxs) var(--sg-space-sm); margin-left:var(--sg-space-sm); vertical-align:middle; }

  /* bordvisning som i notatet */
  .table-view{ display:flex; gap:var(--sg-space-lg); align-items:flex-start; flex-wrap:wrap; margin-bottom:var(--sg-space-lg); }
  .felt{ position:relative; width:5rem; height:5rem; flex:none; border-radius:var(--sg-radius-md); background:var(--sg-table); border:5px solid var(--sg-canvas-soft);
         color:#fff; font-weight:600; font-size:.875rem; }
  .felt.vns{ border-top-color:var(--suit-red); border-bottom-color:var(--suit-red); }
  .felt.vov{ border-left-color:var(--suit-red); border-right-color:var(--suit-red); }
  .felt.valle{ border-color:var(--suit-red); }
  .felt span{ position:absolute; line-height:1; padding:.12rem .22rem; border-radius:50%; }
  .felt .n{ top:.15rem; left:50%; transform:translateX(-50%); } .felt .s{ bottom:.15rem; left:50%; transform:translateX(-50%); }
  .felt .w{ left:.2rem; top:50%; transform:translateY(-50%); } .felt .e{ right:.2rem; top:50%; transform:translateY(-50%); }
  .felt .giver{ box-shadow:0 0 0 2px var(--sg-primary); }
  .tinfo{ font-size:.75rem; line-height:1.35; color:var(--sg-body); margin-top:var(--sg-space-sm); }
  table.auc{ border-collapse:collapse; font-size:1rem; }
  table.auc th{ font-size:.75rem; font-weight:600; color:var(--sg-body); border-bottom:1px solid var(--sg-hairline); padding:var(--sg-space-xs) var(--sg-space-lg) var(--sg-space-xs) var(--sg-space-xs); text-align:left; }
  table.auc td{ padding:var(--sg-space-xs) var(--sg-space-lg) var(--sg-space-xs) var(--sg-space-xs); border-bottom:1px solid var(--sg-canvas-soft); min-width:2.4rem; }
  table.auc .pas{ color:var(--sg-body); }
  table.auc .x{ font-weight:600; color:var(--bid-dbl); }
  table.auc .me{ font-weight:600; }
  table.auc .ask{ font-weight:600; }
  .compact .cell{ font-size:.8rem; padding:.3rem .1rem; }
  .compact .box, .compact .specialrow{ max-width:20rem; }
</style>
</head>
<body>
<header id="topbjaelke" data-aktiv="traen" data-sprog></header>
<script src="assets/topbar.js"></script>

<div class="wrap trainer">
  <section class="hero">
    <p class="eyebrow" id="group"></p>
    <h1 id="title" data-en="Training">Træning</h1>
    <p class="deck" id="desc"></p>
    <div class="profiles" id="profiles"><span class="lbl" data-en="Profile:">Profil:</span></div>
  </section>

  <div class="chooser" id="chooser" style="display:none"></div>

  <div class="progress" id="progress"></div>

  <div class="board" id="board">
    <div class="play">
      <span class="rolechip" id="role"></span>
      <div class="auction" id="auction"></div>
      <div class="table-view" id="tableView" style="display:none"></div>
      <p class="sitnote" id="sitnote"></p>
      <div class="hand" id="hand"></div>
      <div class="hintinfo" id="hintInfo"></div>
      <button class="next" id="nextBtn" data-en="Next hand →">Næste hånd →</button>
    </div>
    <div class="bidding">
      <div class="qrow">
        <p class="qtext" data-en="What do you bid?">Hvad melder du?</p>
        <button class="hint-btn" id="hintBtn" title="Vis fire mulige meldinger" data-en-title="Show four possible bids" aria-pressed="false">💡</button>
      </div>
      <div class="box" id="box"></div>
      <div class="specialrow" id="special"></div>
      <div class="feedback" id="feedback"></div>
    </div>
    <div class="bonus">
      <p class="label" data-en="Bonus question">Bonusspørgsmål</p>
      <p class="bq" id="bonusQ"></p>
      <div class="opts" id="bonusOpts"></div>
      <div class="bfeedback" id="bonusFeedback"></div>
    </div>
  </div>

  <p class="small source" id="source"></p>
</div>

<script>
const STRAINS = ['♣','♦','♥','♠','NT'];
function suitClass(s){ return (s === '♥' || s === '♦') ? 'r' : 'k'; }
// Fritekst fra puljer og data: escapes og farver kulørsymbolerne (♥♦ røde, ♠♣ sorte)
function suits(t){
  return String(t).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]))
    .replace(/[♠♥♦♣]/g, c => `<span class="su ${suitClass(c)}">${c}</span>`);
}
function rank(level, strainIdx){ return level*5 + strainIdx; }
function parseCall(call){
  if (call === 'Pas' || call === 'X' || call === 'XX') return null;
  const level = parseInt(call[0],10);
  const strain = call.slice(1);
  return { level, strain, idx: STRAINS.indexOf(strain) };
}
function callRank(call){
  const p = parseCall(call);
  return p ? rank(p.level, p.idx) : -1;
}

// Each round draws ROUND_SIZE random hands from pools/<konvention>.json (made by build_pools.py)
const ROUND_SIZE = 8;
const POOL_SUITS = [['S','♠'],['H','♥'],['D','♦'],['C','♣']];
const RANK_NAMES = T({ 14: 'E', 13: 'K', 12: 'D', 11: 'B' }, { 14: 'A', 13: 'K', 12: 'Q', 11: 'J' });

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Profiler (Kampen om kontrakten): Grund = kun bogens regler, Klub = + faste aftaler, Turnering = + toggles
const PROFILES = ['grund','klub','turnering'];
const PROFILE_NAMES = T({ grund:'Grund', klub:'Klub', turnering:'Turnering' }, { grund:'Basic', klub:'Club', turnering:'Tournament' });
function resolveForProfile(h, profile){
  if (h.only && !h.only.includes(profile)) return null;
  if (h[profile]) return { ...h, correct: h[profile].correct, why: h[profile].why, aftale: profile !== 'grund' && !!h.aftale };
  if (profile === 'grund' && h.aftale) return null;
  return h;
}
function buildQuestion(h, sit){
  const others = shuffle(sit.calls.filter(c => c !== h.correct)).slice(0, 3);
  return {
    role: sit.rolle || '',
    note: sit.note || '',
    auction: sit.auction,
    lowest: Math.max(...sit.auction.map(([, call]) => callRank(call))) + 1,
    allowX: !!sit.allowX,
    allowXX: !!sit.allowXX,
    hand: POOL_SUITS.map(([k, sym]) => [sym, h.hand[k].map(r => RANK_NAMES[r] || r).join(' ') || '—']),
    hp: h.hp, sp: h.sp,
    correct: h.correct,
    hints: shuffle([h.correct, ...others]),
    why: h.why, zone: h.zone, aftale: !!h.aftale,
    bonus: { ...sit.bonus, options: shuffle(sit.bonus.options) }
  };
}

let Q = [];
let idx = 0, score = 0, answered = false, results = [], hintOn = false;

const $ = id => document.getElementById(id);
const progressEl = $('progress'), auctionEl = $('auction'), handEl = $('hand'), boxEl = $('box'),
      specialEl = $('special'), feedbackEl = $('feedback'), nextBtn = $('nextBtn'), hintBtn = $('hintBtn'),
      boardEl = $('board');

function fmtCall(call){
  if (call === 'X' || call === 'XX' || call === 'Pas') return W(call);
  const p = parseCall(call);
  return p.strain === 'NT' ? `${p.level}NT` : `${p.level}<span class="su ${suitClass(p.strain)}">${p.strain}</span>`;
}
function callClass(call){ return call === 'Pas' ? ' pas' : (call === 'X' || call === 'XX') ? ' dbl' : ''; }

function renderProgress(){
  progressEl.innerHTML = '';
  for (let i = 0; i < Q.length; i++){
    const el = document.createElement('i');
    if (i < results.length) el.className = results[i] ? 'done' : 'done wrong';
    else if (i === idx) el.className = 'current';
    progressEl.appendChild(el);
  }
}

function renderAuction(q){
  const slots = q.auction.map(([who, call]) =>
    `<div class="slot"><span class="who">${W(who)}</span><span class="bc${callClass(call)}${who === 'Modstander' && call !== 'Pas' ? ' them' : ''}">${fmtCall(call)}</span></div>`);
  slots.push(`<div class="slot"><span class="who">${W('Dig')}</span><span class="bc ask">?</span></div>`);
  auctionEl.innerHTML = slots.join('');
}

// Bord: Dig sidder Syd. Sæderne regnes baglæns fra Syd ud fra meldingernes rækkefølge.
const SEATS = T(['N','Ø','S','V'], ['N','E','S','W']);
const SEAT_NAMES = T(['Nord','Øst','Syd','Vest'], ['North','East','South','West']);
function renderTable(q){
  const n = q.auction.length;
  const seatOf = i => ((2 - (n - i)) % 4 + 4) % 4;          // indeks i meldeforløbet -> sæde (N=0, Ø=1, S=2, V=3)
  const dealer = seatOf(0);
  const zone = q.zone || null;
  const zcls = zone === 'ns' ? ' vns' : zone === 'ov' ? ' vov' : zone === 'alle' ? ' valle' : '';
  const zname = T({ ingen:'Ingen', ns:'Nord-Syd', ov:'Øst-Vest', alle:'Alle' }, { ingen:'None', ns:'North-South', ov:'East-West', alle:'All' })[zone];
  const zrel = T({ ingen:'ingen i zonen', ns:'I er i zonen', ov:'de er i zonen', alle:'alle i zonen' },
                 { ingen:'nobody vulnerable', ns:'you are vulnerable', ov:'they are vulnerable', alle:'everybody vulnerable' })[zone];
  const seatSpan = (k, cls) => `<span class="${cls}${dealer === SEATS.indexOf(k) ? ' giver' : ''}">${k}</span>`;
  const felt = `<div><div class="felt${zcls}" role="img" aria-label="${T('Giver', 'Dealer')} ${SEAT_NAMES[dealer]}${zone ? ', ' + T('zone', 'vulnerability') + ' ' + zname : ''}">${seatSpan(SEATS[0],'n')}${seatSpan(SEATS[1],'e')}${seatSpan(SEATS[2],'s')}${seatSpan(SEATS[3],'w')}</div>
    <div class="tinfo">${T('Giver', 'Dealer')}: ${SEAT_NAMES[dealer]}${zone ? `<br>${T('Zone', 'Vulnerability')}: ${zname}<br><b>${zrel}</b>` : ''}<br>${T('Du er Syd', 'You are South')}</div></div>`;
  const col = seat => (seat + 1) % 4;                         // kolonner V N Ø S
  const cells = [];
  for (let c = 0; c < col(dealer); c++) cells.push('<td></td>');
  q.auction.forEach(([who, call]) => {
    const cls = call === 'Pas' ? 'pas' : (call === 'X' || call === 'XX') ? 'x' : who === 'Dig' ? 'me' : '';
    cells.push(`<td class="${cls}">${call === 'Pas' ? T('pas', 'pass') : fmtCall(call)}</td>`);
  });
  cells.push('<td class="ask">?</td>');
  let rows = '';
  for (let i = 0; i < cells.length; i += 4) rows += '<tr>' + cells.slice(i, i + 4).join('') + '</tr>';
  $('tableView').innerHTML = felt + `<table class="auc"><thead><tr><th>${SEATS[3]}</th><th>${SEATS[0]}</th><th>${SEATS[1]}</th><th>${SEATS[2]}</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function render(){
  answered = false; hintOn = false;
  hintBtn.setAttribute('aria-pressed','false');
  const q = Q[idx];
  renderProgress();
  $('role').textContent = q.role ? youAre(q.role) : '';
  $('role').style.display = q.role ? '' : 'none';
  if (LAYOUT === 'bord'){ auctionEl.style.display = 'none'; $('tableView').style.display = ''; renderTable(q); }
  else renderAuction(q);
  $('sitnote').textContent = q.note;
  handEl.innerHTML = q.hand.map(([s,c]) => `<div class="row"><span class="s ${suitClass(s)}">${s}</span><span>${c}</span></div>`).join('');
  $('hintInfo').className = 'hintinfo';

  boxEl.innerHTML = '';
  for (let lvl = 1; lvl <= 7; lvl++){
    if (rank(lvl, 4) < q.lowest) continue;   // hele rækken ligger under laveste lovlige melding
    STRAINS.forEach((s, sIdx) => {
      const call = lvl + s;
      const btn = document.createElement('button');
      btn.className = 'cell';
      btn.dataset.call = call;
      btn.innerHTML = fmtCall(call);
      const legal = rank(lvl, sIdx) >= q.lowest;
      btn.disabled = !legal;
      if (legal) btn.addEventListener('click', () => choose(call, btn));
      boxEl.appendChild(btn);
    });
  }
  specialEl.innerHTML = '';
  ['Pas','X','XX'].forEach(call => {
    const btn = document.createElement('button');
    btn.className = 'cell' + callClass(call);
    btn.dataset.call = call;
    btn.textContent = W(call);
    const legal = call === 'Pas' || (call === 'X' && q.allowX) || (call === 'XX' && q.allowXX);
    btn.disabled = !legal;
    if (legal) btn.addEventListener('click', () => choose(call, btn));
    specialEl.appendChild(btn);
  });

  feedbackEl.className = 'feedback';
  feedbackEl.innerHTML = '';
  nextBtn.className = 'next';

  $('bonusQ').innerHTML = suits(q.bonus.q);
  const bOptsEl = $('bonusOpts');
  bOptsEl.innerHTML = '';
  q.bonus.options.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'bopt';
    b.innerHTML = suits(opt);
    b.dataset.opt = opt;
    b.addEventListener('click', () => chooseBonus(opt, b));
    bOptsEl.appendChild(b);
  });
  $('bonusFeedback').className = 'bfeedback';
  $('bonusFeedback').textContent = '';
}

function allCells(){ return [...boxEl.children, ...specialEl.children]; }

hintBtn.addEventListener('click', () => {
  if (answered) return;
  hintOn = !hintOn;
  hintBtn.setAttribute('aria-pressed', hintOn ? 'true' : 'false');
  const q = Q[idx];
  allCells().forEach(b => b.classList.toggle('hinted', hintOn && q.hints.includes(b.dataset.call)));
  $('hintInfo').textContent = T(`Din hånd: ${q.hp} hp / ${q.sp} sp`, `Your hand: ${q.hp} HCP / ${q.sp} support points`);
  $('hintInfo').className = hintOn ? 'hintinfo show' : 'hintinfo';
});

function choose(call, btn){
  if (answered) return;
  answered = true;
  const q = Q[idx];
  const isCorrect = call === q.correct;
  results[idx] = isCorrect;
  if (isCorrect) score++;
  allCells().forEach(b => {
    if (b.dataset.call === q.correct) b.classList.add('correct');
    b.disabled = true;
  });
  if (!isCorrect) btn.classList.add('incorrect');
  feedbackEl.className = 'feedback show ' + (isCorrect ? 'ok' : 'no');
  feedbackEl.innerHTML = `<b>${isCorrect ? T('Rigtigt — ', 'Correct — ') + fmtCall(q.correct) : T('Facit: ', 'Answer: ') + fmtCall(q.correct)}${q.aftale
    ? `<span class="aftale" title="${T('Facit hviler på jeres aftale, ikke bogens regel', 'The answer rests on your agreement, not on the book rule')}">${T('Aftale', 'Agreement')}</span>` : ''}</b>${suits(q.why)}`;
  nextBtn.className = 'next show';
  nextBtn.textContent = idx === Q.length - 1 ? T('Se resultat →', 'See the result →') : T('Næste hånd →', 'Next hand →');
  renderProgress();
}

function chooseBonus(opt, btn){
  const q = Q[idx];
  const opts = [...$('bonusOpts').children];
  if (opts[0].disabled) return; // already answered
  opts.forEach(b => {
    b.disabled = true;
    if (b.dataset.opt === q.bonus.correct) b.classList.add('correct');
  });
  if (opt !== q.bonus.correct) btn.classList.add('incorrect');
  $('bonusFeedback').className = 'bfeedback show';
  $('bonusFeedback').innerHTML = suits(q.bonus.why);
}

nextBtn.addEventListener('click', () => {
  idx++;
  if (idx >= Q.length){ renderDone(); return; }
  render();
});

function renderDone(){
  boardEl.style.display = 'block';
  boardEl.innerHTML = `
    <div class="done">
      <p class="qtext">${T('Du klarede', 'You got')}</p>
      <div class="score">${score} / ${Q.length}</div>
      <p>${score === Q.length ? T('Hele svarstrukturen sidder.', 'The whole structure has stuck.') : T('Gennemgå forklaringerne igen, og prøv en gang til.', 'Go through the explanations again and have another go.')}</p>
      <div class="actions">
        <button class="btn primary" id="restartBtn">${T('Ny omgang', 'New round')}</button>
        <a class="btn" href="${backLink}">${T('Vælg konvention', 'Choose a convention')}</a>
      </div>
    </div>`;
  $('restartBtn').addEventListener('click', () => location.reload());
}

function fail(msg){
  boardEl.innerHTML = `<p class="qtext">${msg}</p><p class="small"><a href="./#traen">${T('← Tilbage til konventionerne', '← Back to the conventions')}</a></p>`;
}

const id = new URLSearchParams(location.search).get('k') || 'multiforsvar';
let backLink = './#traen';
let LAYOUT = 'liste', PROFILE = null, POOL = null;
function getProfile(){ try { const p = localStorage.getItem('profil'); if (PROFILES.includes(p)) return p; } catch (e) {} return 'klub'; }
function setupProfiles(){
  const el = $('profiles');
  el.className = 'profiles show';
  PROFILES.forEach(p => {
    const b = document.createElement('button');
    b.textContent = PROFILE_NAMES[p];
    b.setAttribute('aria-pressed', p === PROFILE ? 'true' : 'false');
    b.title = T({ grund:'Kun bogens entydige regler', klub:'Bogen + jeres faste aftaler', turnering:'Klub + Stenberg og Lebensohl' },
                { grund:'Only the book\'s unambiguous rules', klub:'The book + your fixed agreements', turnering:'Club + Stenberg and Lebensohl' })[p];
    b.addEventListener('click', () => { try { localStorage.setItem('profil', p); } catch (e) {} location.reload(); });
    el.appendChild(b);
  });
}
// Konventioner med varianter (fx forsvar mod 1NT): metoden vælges, før hænderne vises
function setupChooser(k, list, systems){
  let last = null;
  try { last = localStorage.getItem('variant-' + k.id); } catch (e) {}
  const vars = k.varianter.map(v => ({ ...v, k: list.find(x => x.id === v.id) })).filter(v => v.k);
  $('progress').style.display = 'none'; boardEl.style.display = 'none';
  const ch = $('chooser');
  ch.style.display = '';
  ch.innerHTML = `<h2>${k.valg || T('Vælg metode', 'Choose a method')}</h2><div class="opts3">${vars.map(v =>
    `<button data-id="${v.id}" class="${v.id === last ? 'last' : ''}"><b>${v.navn}</b><span>${suits(v.k.beskrivelse)}</span>${v.id === last ? `<div class="lastnote">${T('Sidst valgt', 'Last chosen')}</div>` : ''}</button>`).join('')}</div>`;
  ch.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    const v = vars.find(x => x.id === b.dataset.id);
    try { localStorage.setItem('variant-' + k.id, v.id); } catch (e) {}
    ch.style.display = 'none';
    $('progress').style.display = ''; boardEl.style.display = '';
    $('title').innerHTML = suits(`${k.titel}: ${v.navn}`);
    document.title = `${k.titel}: ${v.navn} — Konventionstræner`;
    $('desc').innerHTML = `${suits(v.k.beskrivelse)} <span class="switch">· <a href="${location.href}">${T('Skift forsvar', 'Change defence')}</a></span>`;
    if (v.k.viden) $('source').innerHTML = T(`Aftalerne står i <a href="${v.k.viden}">${v.navn}-aftalen</a>.`,
                                             `The agreements are in <a href="${v.k.viden}">the ${v.navn} agreement</a> (in Danish).`);
    fetch(`pools/${v.id}.json`).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(pool => { POOL = L(pool); startRound(); })
      .catch(() => fail(T('Kunne ikke hente hånd-puljen.', 'Could not load the hand pool.')));
  }));
}
// "Senest trænet" på forsiden: højst tre konventioner, nyeste først, uden dubletter
function remember(k){
  try {
    const a = JSON.parse(localStorage.getItem('senest') || '[]');
    localStorage.setItem('senest', JSON.stringify([k].concat(Array.isArray(a) ? a.filter(x => x !== k) : []).slice(0, 3)));
  } catch (e) {}
}
function startRound(){
  remember(id);
  let hands = POOL.hands;
  if (PROFILE) hands = hands.map(h => resolveForProfile(h, PROFILE)).filter(Boolean);
  Q = shuffle(hands).slice(0, ROUND_SIZE).map(h => buildQuestion(h, POOL.situations[h.situation]));
  render();
}
Promise.all(['data/konventioner.json', 'data/systemer.json'].map(u => fetch(u).then(r => r.json())))
  .then(([list, systems]) => {
    list = L(list); systems = L(systems);
    const k = list.find(x => x.id === id);
    if (!k || k.status !== 'klar') throw new Error('ukendt');
    const ids = Array.isArray(k.system) ? k.system : [k.system];
    const sys = ids.length > 1 ? { navn: T('Fælles', 'Shared') } : systems.find(x => x.id === ids[0]);
    document.title = `${k.titel} — Konventionstræner`;
    $('group').innerHTML = suits(k.gruppe);
    $('title').innerHTML = suits(k.titel);
    $('desc').innerHTML = suits(k.beskrivelse);
    if (k.layout === 'bord'){ LAYOUT = 'bord'; boardEl.classList.add('compact'); }
    if (k.profiler){ PROFILE = getProfile(); setupProfiles(); }
    if (k.varianter){ setupChooser(k, list, systems); return null; }
    if (k.viden) $('source').innerHTML = T(
      `Aftalerne står i <a href="${k.viden}">${ids.length > 1 ? 'systemdokumentet' : sys && sys.id === 'kamp' ? 'referencelaget Kampen om kontrakten' : sys && sys.id === 'forslag' ? 'forslaget' : sys ? 'systemet for ' + sys.navn : 'vores system'}</a>.`,
      `The agreements are in <a href="${k.viden}">${ids.length > 1 ? 'the system document' : sys && sys.id === 'kamp' ? 'the reference layer The battle for the contract' : sys && sys.id === 'forslag' ? 'the proposal' : sys ? 'the system for ' + sys.navn : 'our system'}</a> (in Danish).`);
    return fetch(`pools/${k.id}.json`).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  })
  .then(pool => { if (pool){ POOL = L(pool); startRound(); } })
  .catch(e => fail(e.message === 'ukendt'
    ? T('Den konvention findes ikke – eller den er ikke klar endnu.', 'That convention does not exist – or it is not ready yet.')
    : T('Kunne ikke hente hånd-puljen. Åbn siden via GitHub Pages eller en lokal webserver — ikke direkte som fil.',
        'Could not load the hand pool. Open the page via GitHub Pages or a local web server — not directly as a file.')));
</script>
<footer id="sidefod"></footer>
<script src="assets/footer.js"></script>
</body>
