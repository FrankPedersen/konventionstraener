<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Træning — Konventionstræner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;0,800;1,400&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Symbols+2&text=%E2%99%A0%E2%99%A5%E2%99%A6%E2%99%A3&display=swap">
<link rel="stylesheet" href="assets/site.css">
<style>
  .trainer{ max-width:64rem; padding-bottom:2rem; }
  .hero{ padding:.9rem 0 .6rem; margin-bottom:.8rem; }
  .hero .eyebrow{ margin:0; }
  .hero h1{ font-size:clamp(1.4rem,3.4vw,1.9rem); margin:.1rem 0 .2rem; }
  .hero .deck{ font-size:.98rem; line-height:1.4; }
  @media (max-width:600px){ .hero .deck{ display:none; } }

  .progress{ display:flex; gap:6px; margin-bottom:.7rem; }
  .progress i{ flex:1; height:4px; border-radius:2px; background:var(--line-strong); position:relative; overflow:hidden; }
  .progress i.done::after, .progress i.current::after{ content:""; position:absolute; inset:0; background:var(--felt); }
  .progress i.wrong::after{ background:var(--bad); }

  .board{ border:1px solid var(--line-strong); border-radius:.6rem; padding:.9rem; background:var(--panel);
          display:flex; flex-direction:column; gap:.9rem; }
  @media (min-width:860px){
    .board{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.1fr); grid-template-areas:"play bid" "play bonus";
            align-items:start; column-gap:1.4rem; row-gap:.9rem; padding:1rem 1.1rem; }
    .play{ grid-area:play; } .bidding{ grid-area:bid; } .bonus{ grid-area:bonus; }
  }
  .rolechip{ display:inline-block; font-family:var(--sans); font-weight:800; font-size:.75rem; letter-spacing:.06em; text-transform:uppercase;
             color:#fff; background:var(--felt-deep); padding:.12rem .55rem; border-radius:999px; margin-bottom:.6rem; }

  .auction{ display:flex; flex-wrap:wrap; gap:.45rem .55rem; align-items:flex-end; margin-bottom:.8rem; }
  .auction .slot{ display:flex; flex-direction:column; align-items:center; gap:.25rem; }
  .auction .who{ font-family:var(--sans); font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  .auction .bc{ font-size:.98rem; min-width:2.5em; padding:.28em .35em; }
  .auction .bc.them{ opacity:.7; }
  .auction .bc.ask{ opacity:.4; }

  .hand{ max-width:15rem; background:var(--card); border:1px solid var(--card-edge); border-radius:.5rem; box-shadow:var(--shadow);
         padding:.55rem .85rem; font-family:var(--sans); font-size:1.08rem; font-weight:700; line-height:1.4; }
  .hand .row{ display:flex; gap:.6rem; }
  .hand .s{ width:1.1em; text-align:center; font-family:var(--sym); font-weight:400; }

  .bonus{ border-left:3px solid var(--gold); background:var(--paper); border-radius:0 .45rem .45rem 0; padding:.6rem .85rem; }
  .bonus .label{ font-family:var(--sans); font-weight:800; font-size:.8rem; letter-spacing:.06em; text-transform:uppercase; color:var(--gold); margin:0 0 .3rem; }
  .bonus .bq{ font-size:1rem; margin:0 0 .5rem; line-height:1.35; }
  .bonus .opts{ display:grid; gap:.35rem; }
  .bopt{ font-family:var(--sans); font-size:.92rem; text-align:left; background:var(--card); color:var(--ink); border:1px solid var(--card-edge);
         border-radius:.35rem; padding:.35rem .6rem; cursor:pointer; }
  .bopt:hover:not(:disabled){ border-color:var(--felt); }
  .bopt:disabled{ cursor:default; }
  .bopt.correct, .cell.correct{ background:var(--good-bg); border-color:var(--good); color:var(--good-ink); }
  .bopt.incorrect, .cell.incorrect{ background:var(--bad-bg); border-color:var(--bad); color:var(--bad-ink); }
  .bfeedback{ margin-top:.5rem; font-size:.95rem; line-height:1.45; color:var(--muted); display:none; }
  .bfeedback.show{ display:block; }

  .qrow{ display:flex; align-items:center; justify-content:space-between; gap:.6rem; margin:0 0 .4rem; }
  .qtext{ font-family:var(--sans); font-weight:700; font-size:1.05rem; margin:0; }
  .hint-btn{ background:var(--paper); border:1px solid var(--line-strong); color:var(--gold); border-radius:999px; width:2rem; height:2rem;
             font-size:1rem; cursor:pointer; flex:none; }
  .hint-btn:hover{ border-color:var(--gold); }
  .hint-btn[aria-pressed="true"]{ background:var(--gold); color:#23180a; }
  .hintinfo{ font-family:var(--sans); font-size:.95rem; color:var(--ink); background:var(--paper); border-left:3px solid var(--gold);
             padding:.4rem .7rem; margin:0 0 .6rem; display:none; }
  .hintinfo.show{ display:block; }

  .box{ display:grid; grid-template-columns:repeat(5,1fr); gap:3px; margin-bottom:3px; }
  .specialrow{ display:grid; grid-template-columns:repeat(3,1fr); gap:3px; }
  .cell{ font-family:var(--sans); font-weight:800; font-size:.88rem; line-height:1.2; background:var(--card); color:var(--ink);
         border:1px solid var(--card-edge); border-radius:.28rem; padding:.24rem .1rem; cursor:pointer; }
  .cell:hover:not(:disabled){ border-color:var(--felt); box-shadow:var(--shadow); }
  .cell:disabled{ opacity:.35; cursor:default; }
  .cell.correct, .cell.incorrect{ opacity:1; }
  .cell.hinted:not(:disabled){ outline:2px solid var(--gold); outline-offset:1px; }
  .cell.pas{ background:var(--pas); color:#fff; border-color:transparent; }
  .cell.dbl{ background:var(--dbl); color:#fff; border-color:transparent; }
  .cell.pas.correct, .cell.dbl.correct{ outline:3px solid var(--good); outline-offset:1px; }
  .cell.pas.incorrect, .cell.dbl.incorrect{ outline:3px solid var(--bad); outline-offset:1px; }

  .feedback{ margin-top:.7rem; padding:.6rem .8rem; border-radius:.45rem; font-size:.98rem; line-height:1.45; display:none; }
  .feedback.show{ display:block; }
  .feedback.ok{ background:var(--good-bg); color:var(--good-ink); }
  .feedback.no{ background:var(--bad-bg); color:var(--bad-ink); }
  .feedback b{ display:block; font-family:var(--sans); margin-bottom:.2rem; }

  .next{ margin-top:.7rem; display:none; width:100%; background:var(--felt-deep); color:#fff; border:none; border-radius:.45rem; padding:.65rem;
         font-family:var(--sans); font-weight:800; font-size:1.02rem; cursor:pointer; }
  .next:hover{ filter:brightness(1.1); }
  .next.show{ display:block; }

  .done{ text-align:center; padding:.6rem 0 .2rem; }
  .done .score{ font-family:var(--serif); font-weight:800; font-size:3rem; color:var(--felt); margin:.2rem 0; }
  .done .actions{ display:flex; gap:.6rem; justify-content:center; flex-wrap:wrap; margin-top:1rem; }
  .btn{ font-family:var(--sans); font-weight:800; font-size:1rem; border-radius:.45rem; padding:.65rem 1.1rem; cursor:pointer; text-decoration:none;
        border:1px solid var(--line-strong); background:var(--paper); color:var(--ink); }
  .btn.primary{ background:var(--felt-deep); color:#fff; border-color:transparent; }
  .source{ margin-top:.8rem; }

  /* profilvalg (Kampen om kontrakten) */
  .profiles{ display:none; gap:.4rem; align-items:center; flex-wrap:wrap; font-family:var(--sans); font-size:.9rem; margin:.3rem 0 .2rem; }
  .profiles.show{ display:flex; }
  .profiles .lbl{ color:var(--muted); margin-right:.2rem; }

  /* valg af metode inden runden (fx forsvar mod 1NT) */
  .chooser{ margin:1rem 0 1.4rem; }
  .chooser h2{ font-size:1.3rem; margin:0 0 .7rem; }
  .chooser .opts3{ display:grid; grid-template-columns:repeat(auto-fit,minmax(13rem,1fr)); gap:.8rem; }
  .chooser button{ display:flex; flex-direction:column; justify-content:flex-start; text-align:left; font:inherit; background:var(--paper); border:1px solid var(--line-strong); border-left:4px solid var(--felt);
                   border-radius:.5rem; padding:.8rem 1rem; cursor:pointer; color:var(--ink); }
  .chooser button:hover, .chooser button:focus-visible{ border-color:var(--felt); box-shadow:0 2px 10px rgba(0,0,0,.08); }
  .chooser button b{ display:block; font-family:var(--sans); font-size:1.05rem; color:var(--felt-deep); margin-bottom:.25rem; }
  .chooser button span{ font-size:.92rem; line-height:1.45; color:var(--muted); }
  .chooser button.last{ border-left-color:var(--gold); }
  .chooser .lastnote{ font-family:var(--sans); font-size:.75rem; color:var(--gold); font-weight:800; text-transform:uppercase; letter-spacing:.05em; }
  .switch{ font-family:var(--sans); font-size:.9rem; margin:.3rem 0 .2rem; }
  .profiles button{ font-family:var(--sans); font-weight:700; font-size:.85rem; border:1px solid var(--line-strong); background:var(--paper);
                    color:var(--ink); border-radius:999px; padding:.2rem .7rem; cursor:pointer; }
  .profiles button[aria-pressed="true"]{ background:var(--felt-deep); color:#fff; border-color:transparent; }
  .aftale{ display:inline-block; font-family:var(--sans); font-size:.75rem; font-weight:800; letter-spacing:.05em; text-transform:uppercase;
           color:#23180a; background:var(--gold); border-radius:999px; padding:.05rem .5rem; margin-left:.4rem; vertical-align:middle; }

  /* bordvisning som i notatet */
  .table-view{ display:flex; gap:1rem; align-items:flex-start; flex-wrap:wrap; margin-bottom:.8rem; }
  .felt{ position:relative; width:5rem; height:5rem; flex:none; border-radius:.55rem; background:var(--felt-deep); border:5px solid #d6dfd9;
         color:#fff; font-family:var(--sans); font-weight:800; font-size:.9rem; }
  .felt.vns{ border-top-color:#c00000; border-bottom-color:#c00000; }
  .felt.vov{ border-left-color:#c00000; border-right-color:#c00000; }
  .felt.valle{ border-color:#c00000; }
  .felt span{ position:absolute; line-height:1; padding:.12rem .22rem; border-radius:50%; }
  .felt .n{ top:.15rem; left:50%; transform:translateX(-50%); } .felt .s{ bottom:.15rem; left:50%; transform:translateX(-50%); }
  .felt .w{ left:.2rem; top:50%; transform:translateY(-50%); } .felt .e{ right:.2rem; top:50%; transform:translateY(-50%); }
  .felt .giver{ box-shadow:0 0 0 2px var(--gold); }
  .tinfo{ font-family:var(--sans); font-size:.8rem; line-height:1.35; color:var(--muted); margin-top:.35rem; }
  table.auc{ border-collapse:collapse; font-family:var(--sans); font-size:.98rem; }
  table.auc th{ color:var(--felt); font-weight:800; border-bottom:2px solid var(--felt); padding:.2rem .8rem .2rem .2rem; text-align:left; }
  table.auc td{ padding:.2rem .8rem .2rem .2rem; border-bottom:1px solid var(--line); min-width:2.4rem; }
  table.auc .pas{ color:var(--muted); }
  table.auc .x{ font-weight:800; color:var(--dbl); }
  table.auc .me{ font-weight:800; }
  table.auc .ask{ color:var(--gold); font-weight:800; }
  .compact .cell{ font-size:.8rem; padding:.18rem .1rem; }
  .compact .box, .compact .specialrow{ max-width:20rem; }
</style>
</head>
<body>
<header class="site-head"><div class="in">
  <a class="brand" href="./">Konventionstræner</a>
  <nav><a href="./#traen" aria-current="page">Træn</a><a href="viden/">Viden</a></nav>
</div></header>

<div class="wrap trainer">
  <section class="hero">
    <p class="eyebrow" id="group"></p>
    <h1 id="title">Træning</h1>
    <p class="deck" id="desc"></p>
    <div class="profiles" id="profiles"><span class="lbl">Profil:</span></div>
  </section>

  <div class="chooser" id="chooser" style="display:none"></div>

  <div class="progress" id="progress"></div>

  <div class="board" id="board">
    <div class="play">
      <span class="rolechip" id="role"></span>
      <div class="auction" id="auction"></div>
      <div class="table-view" id="tableView" style="display:none"></div>
      <div class="hand" id="hand"></div>
    </div>
    <div class="bidding">
      <div class="qrow">
        <p class="qtext">Hvad melder du?</p>
        <button class="hint-btn" id="hintBtn" title="Vis fire mulige meldinger" aria-pressed="false">💡</button>
      </div>
      <div class="hintinfo" id="hintInfo"></div>
      <div class="box" id="box"></div>
      <div class="specialrow" id="special"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next" id="nextBtn">Næste hånd →</button>
    </div>
    <div class="bonus">
      <p class="label">Bonusspørgsmål</p>
      <p class="bq" id="bonusQ"></p>
      <div class="opts" id="bonusOpts"></div>
      <div class="bfeedback" id="bonusFeedback"></div>
    </div>
  </div>

  <p class="small source" id="source"></p>
</div>

<script>
const STRAINS = ['♣','♦','♥','♠','NT'];
function suitClass(s){ return (s === '♥' || s === '♦') ? 'r' : 'k'; }
// Fritekst fra puljer og data: escapes og farver kulørsymbolerne (♥♦ røde, ♠♣ sorte)
function suits(t){
  return String(t).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]))
    .replace(/[♠♥♦♣]/g, c => `<span class="su ${suitClass(c)}">${c}</span>`);
}
function rank(level, strainIdx){ return level*5 + strainIdx; }
function parseCall(call){
  if (call === 'Pas' || call === 'X' || call === 'XX') return null;
  const level = parseInt(call[0],10);
  const strain = call.slice(1);
  return { level, strain, idx: STRAINS.indexOf(strain) };
}
function callRank(call){
  const p = parseCall(call);
  return p ? rank(p.level, p.idx) : -1;
}

// Each round draws ROUND_SIZE random hands from pools/<konvention>.json (made by build_pools.py)
const ROUND_SIZE = 8;
const POOL_SUITS = [['S','♠'],['H','♥'],['D','♦'],['C','♣']];
const RANK_NAMES = { 14: 'E', 13: 'K', 12: 'D', 11: 'B' };

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Profiler (Kampen om kontrakten): Grund = kun bogens regler, Klub = + faste aftaler, Turnering = + toggles
const PROFILES = ['grund','klub','turnering'];
const PROFILE_NAMES = { grund:'Grund', klub:'Klub', turnering:'Turnering' };
function resolveForProfile(h, profile){
  if (h.only && !h.only.includes(profile)) return null;
  if (h[profile]) return { ...h, correct: h[profile].correct, why: h[profile].why, aftale: profile !== 'grund' && !!h.aftale };
  if (profile === 'grund' && h.aftale) return null;
  return h;
}
function buildQuestion(h, sit){
  const others = shuffle(sit.calls.filter(c => c !== h.correct)).slice(0, 3);
  return {
    role: sit.rolle || '',
    auction: sit.auction,
    lowest: Math.max(...sit.auction.map(([, call]) => callRank(call))) + 1,
    allowX: !!sit.allowX,
    allowXX: !!sit.allowXX,
    hand: POOL_SUITS.map(([k, sym]) => [sym, h.hand[k].map(r => RANK_NAMES[r] || r).join(' ') || '—']),
    hp: h.hp, sp: h.sp,
    correct: h.correct,
    hints: shuffle([h.correct, ...others]),
    why: h.why, zone: h.zone, aftale: !!h.aftale,
    bonus: { ...sit.bonus, options: shuffle(sit.bonus.options) }
  };
}

let Q = [];
let idx = 0, score = 0, answered = false, results = [], hintOn = false;

const $ = id => document.getElementById(id);
const progressEl = $('progress'), auctionEl = $('auction'), handEl = $('hand'), boxEl = $('box'),
      specialEl = $('special'), feedbackEl = $('feedback'), nextBtn = $('nextBtn'), hintBtn = $('hintBtn'),
      boardEl = $('board');

function fmtCall(call){
  if (call === 'X' || call === 'XX' || call === 'Pas') return call;
  const p = parseCall(call);
  return p.strain === 'NT' ? `${p.level}NT` : `${p.level}<span class="su ${suitClass(p.strain)}">${p.strain}</span>`;
}
function callClass(call){ return call === 'Pas' ? ' pas' : (call === 'X' || call === 'XX') ? ' dbl' : ''; }

function renderProgress(){
  progressEl.innerHTML = '';
  for (let i = 0; i < Q.length; i++){
    const el = document.createElement('i');
    if (i < results.length) el.className = results[i] ? 'done' : 'done wrong';
    else if (i === idx) el.className = 'current';
    progressEl.appendChild(el);
  }
}

function renderAuction(q){
  const slots = q.auction.map(([who, call]) =>
    `<div class="slot"><span class="who">${who}</span><span class="bc${callClass(call)}${who === 'Modstander' && call !== 'Pas' ? ' them' : ''}">${fmtCall(call)}</span></div>`);
  slots.push(`<div class="slot"><span class="who">Dig</span><span class="bc ask">?</span></div>`);
  auctionEl.innerHTML = slots.join('');
}

// Bord: Dig sidder Syd. Sæderne regnes baglæns fra Syd ud fra meldingernes rækkefølge.
const SEATS = ['N','Ø','S','V'];
const SEAT_NAMES = ['Nord','Øst','Syd','Vest'];
function renderTable(q){
  const n = q.auction.length;
  const seatOf = i => ((2 - (n - i)) % 4 + 4) % 4;          // indeks i meldeforløbet -> sæde (N=0, Ø=1, S=2, V=3)
  const dealer = seatOf(0);
  const zone = q.zone || null;
  const zcls = zone === 'ns' ? ' vns' : zone === 'ov' ? ' vov' : zone === 'alle' ? ' valle' : '';
  const zname = { ingen:'Ingen', ns:'Nord-Syd', ov:'Øst-Vest', alle:'Alle' }[zone];
  const zrel = { ingen:'ingen i zonen', ns:'I er i zonen', ov:'de er i zonen', alle:'alle i zonen' }[zone];
  const seatSpan = (k, cls) => `<span class="${cls}${dealer === SEATS.indexOf(k) ? ' giver' : ''}">${k}</span>`;
  const felt = `<div><div class="felt${zcls}" role="img" aria-label="Giver ${SEAT_NAMES[dealer]}${zone ? ', zone ' + zname : ''}">${seatSpan('N','n')}${seatSpan('Ø','e')}${seatSpan('S','s')}${seatSpan('V','w')}</div>
    <div class="tinfo">Giver: ${SEAT_NAMES[dealer]}${zone ? `<br>Zone: ${zname}<br><b>${zrel}</b>` : ''}<br>Du er Syd</div></div>`;
  const col = seat => (seat + 1) % 4;                         // kolonner V N Ø S
  const cells = [];
  for (let c = 0; c < col(dealer); c++) cells.push('<td></td>');
  q.auction.forEach(([who, call]) => {
    const cls = call === 'Pas' ? 'pas' : (call === 'X' || call === 'XX') ? 'x' : who === 'Dig' ? 'me' : '';
    cells.push(`<td class="${cls}">${call === 'Pas' ? 'pas' : fmtCall(call)}</td>`);
  });
  cells.push('<td class="ask">?</td>');
  let rows = '';
  for (let i = 0; i < cells.length; i += 4) rows += '<tr>' + cells.slice(i, i + 4).join('') + '</tr>';
  $('tableView').innerHTML = felt + `<table class="auc"><thead><tr><th>V</th><th>N</th><th>Ø</th><th>S</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function render(){
  answered = false; hintOn = false;
  hintBtn.setAttribute('aria-pressed','false');
  const q = Q[idx];
  renderProgress();
  $('role').textContent = q.role ? `Du er ${q.role.toLowerCase()}` : '';
  $('role').style.display = q.role ? '' : 'none';
  if (LAYOUT === 'bord'){ auctionEl.style.display = 'none'; $('tableView').style.display = ''; renderTable(q); }
  else renderAuction(q);
  handEl.innerHTML = q.hand.map(([s,c]) => `<div class="row"><span class="s ${suitClass(s)}">${s}</span><span>${c}</span></div>`).join('');
  $('hintInfo').className = 'hintinfo';

  boxEl.innerHTML = '';
  for (let lvl = 1; lvl <= 7; lvl++){
    if (rank(lvl, 4) < q.lowest) continue;   // hele rækken ligger under laveste lovlige melding
    STRAINS.forEach((s, sIdx) => {
      const call = lvl + s;
      const btn = document.createElement('button');
      btn.className = 'cell';
      btn.dataset.call = call;
      btn.innerHTML = fmtCall(call);
      const legal = rank(lvl, sIdx) >= q.lowest;
      btn.disabled = !legal;
      if (legal) btn.addEventListener('click', () => choose(call, btn));
      boxEl.appendChild(btn);
    });
  }
  specialEl.innerHTML = '';
  ['Pas','X','XX'].forEach(call => {
    const btn = document.createElement('button');
    btn.className = 'cell' + callClass(call);
    btn.dataset.call = call;
    btn.textContent = call;
    const legal = call === 'Pas' || (call === 'X' && q.allowX) || (call === 'XX' && q.allowXX);
    btn.disabled = !legal;
    if (legal) btn.addEventListener('click', () => choose(call, btn));
    specialEl.appendChild(btn);
  });

  feedbackEl.className = 'feedback';
  feedbackEl.innerHTML = '';
  nextBtn.className = 'next';

  $('bonusQ').innerHTML = suits(q.bonus.q);
  const bOptsEl = $('bonusOpts');
  bOptsEl.innerHTML = '';
  q.bonus.options.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'bopt';
    b.innerHTML = suits(opt);
    b.dataset.opt = opt;
    b.addEventListener('click', () => chooseBonus(opt, b));
    bOptsEl.appendChild(b);
  });
  $('bonusFeedback').className = 'bfeedback';
  $('bonusFeedback').textContent = '';
}

function allCells(){ return [...boxEl.children, ...specialEl.children]; }

hintBtn.addEventListener('click', () => {
  if (answered) return;
  hintOn = !hintOn;
  hintBtn.setAttribute('aria-pressed', hintOn ? 'true' : 'false');
  const q = Q[idx];
  allCells().forEach(b => b.classList.toggle('hinted', hintOn && q.hints.includes(b.dataset.call)));
  $('hintInfo').textContent = `Din hånd: ${q.hp} hp / ${q.sp} sp`;
  $('hintInfo').className = hintOn ? 'hintinfo show' : 'hintinfo';
});

function choose(call, btn){
  if (answered) return;
  answered = true;
  const q = Q[idx];
  const isCorrect = call === q.correct;
  results[idx] = isCorrect;
  if (isCorrect) score++;
  allCells().forEach(b => {
    if (b.dataset.call === q.correct) b.classList.add('correct');
    b.disabled = true;
  });
  if (!isCorrect) btn.classList.add('incorrect');
  feedbackEl.className = 'feedback show ' + (isCorrect ? 'ok' : 'no');
  feedbackEl.innerHTML = `<b>${isCorrect ? 'Rigtigt — ' + fmtCall(q.correct) : 'Facit: ' + fmtCall(q.correct)}${q.aftale ? '<span class="aftale" title="Facit hviler på jeres aftale, ikke bogens regel">Aftale</span>' : ''}</b>${suits(q.why)}`;
  nextBtn.className = 'next show';
  nextBtn.textContent = idx === Q.length - 1 ? 'Se resultat →' : 'Næste hånd →';
  renderProgress();
}

function chooseBonus(opt, btn){
  const q = Q[idx];
  const opts = [...$('bonusOpts').children];
  if (opts[0].disabled) return; // already answered
  opts.forEach(b => {
    b.disabled = true;
    if (b.dataset.opt === q.bonus.correct) b.classList.add('correct');
  });
  if (opt !== q.bonus.correct) btn.classList.add('incorrect');
  $('bonusFeedback').className = 'bfeedback show';
  $('bonusFeedback').innerHTML = suits(q.bonus.why);
}

nextBtn.addEventListener('click', () => {
  idx++;
  if (idx >= Q.length){ renderDone(); return; }
  render();
});

function renderDone(){
  boardEl.style.display = 'block';
  boardEl.innerHTML = `
    <div class="done">
      <p class="qtext">Du klarede</p>
      <div class="score">${score} / ${Q.length}</div>
      <p>${score === Q.length ? 'Hele svarstrukturen sidder.' : 'Gennemgå forklaringerne igen, og prøv en gang til.'}</p>
      <div class="actions">
        <button class="btn primary" id="restartBtn">Ny omgang</button>
        <a class="btn" href="${backLink}">Vælg konvention</a>
      </div>
    </div>`;
  $('restartBtn').addEventListener('click', () => location.reload());
}

function fail(msg){
  boardEl.innerHTML = `<p class="qtext">${msg}</p><p class="small"><a href="./#traen">← Tilbage til konventionerne</a></p>`;
}

const id = new URLSearchParams(location.search).get('k') || 'multiforsvar';
let backLink = './#traen';
let LAYOUT = 'liste', PROFILE = null, POOL = null;
function getProfile(){ try { const p = localStorage.getItem('profil'); if (PROFILES.includes(p)) return p; } catch (e) {} return 'klub'; }
function setupProfiles(){
  const el = $('profiles');
  el.className = 'profiles show';
  PROFILES.forEach(p => {
    const b = document.createElement('button');
    b.textContent = PROFILE_NAMES[p];
    b.setAttribute('aria-pressed', p === PROFILE ? 'true' : 'false');
    b.title = { grund:'Kun bogens entydige regler', klub:'Bogen + jeres faste aftaler', turnering:'Klub + Stenberg og Lebensohl' }[p];
    b.addEventListener('click', () => { try { localStorage.setItem('profil', p); } catch (e) {} location.reload(); });
    el.appendChild(b);
  });
}
// Konventioner med varianter (fx forsvar mod 1NT): metoden vælges, før hænderne vises
function setupChooser(k, list, systems){
  let last = null;
  try { last = localStorage.getItem('variant-' + k.id); } catch (e) {}
  const vars = k.varianter.map(v => ({ ...v, k: list.find(x => x.id === v.id) })).filter(v => v.k);
  $('progress').style.display = 'none'; boardEl.style.display = 'none';
  const ch = $('chooser');
  ch.style.display = '';
  ch.innerHTML = `<h2>${k.valg || 'Vælg metode'}</h2><div class="opts3">${vars.map(v =>
    `<button data-id="${v.id}" class="${v.id === last ? 'last' : ''}"><b>${v.navn}</b><span>${suits(v.k.beskrivelse)}</span>${v.id === last ? '<div class="lastnote">Sidst valgt</div>' : ''}</button>`).join('')}</div>`;
  ch.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    const v = vars.find(x => x.id === b.dataset.id);
    try { localStorage.setItem('variant-' + k.id, v.id); } catch (e) {}
    ch.style.display = 'none';
    $('progress').style.display = ''; boardEl.style.display = '';
    $('title').innerHTML = suits(`${k.titel}: ${v.navn}`);
    document.title = `${k.titel}: ${v.navn} — Konventionstræner`;
    $('desc').innerHTML = `${suits(v.k.beskrivelse)} <span class="switch">· <a href="${location.href}">Skift forsvar</a></span>`;
    if (v.k.viden) $('source').innerHTML = `Aftalerne står i <a href="${v.k.viden}">${v.navn}-aftalen</a>.`;
    fetch(`pools/${v.id}.json`).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(pool => { POOL = pool; startRound(); })
      .catch(() => fail('Kunne ikke hente hånd-puljen.'));
  }));
}
function startRound(){
  let hands = POOL.hands;
  if (PROFILE) hands = hands.map(h => resolveForProfile(h, PROFILE)).filter(Boolean);
  Q = shuffle(hands).slice(0, ROUND_SIZE).map(h => buildQuestion(h, POOL.situations[h.situation]));
  render();
}
Promise.all(['data/konventioner.json', 'data/systemer.json'].map(u => fetch(u).then(r => r.json())))
  .then(([list, systems]) => {
    const k = list.find(x => x.id === id);
    if (!k || k.status !== 'klar') throw new Error('ukendt');
    const ids = Array.isArray(k.system) ? k.system : [k.system];
    const sys = ids.length > 1 ? { navn: 'Fælles' } : systems.find(x => x.id === ids[0]);
    let current = null;
    try { current = localStorage.getItem('system'); } catch (e) {}
    backLink = `./?system=${ids.includes(current) ? current : ids[0]}#traen`;
    document.title = `${k.titel} — Konventionstræner`;
    $('group').innerHTML = suits(sys ? `${sys.navn} · ${k.gruppe}` : k.gruppe);
    $('title').innerHTML = suits(k.titel);
    $('desc').innerHTML = suits(k.beskrivelse);
    if (k.layout === 'bord'){ LAYOUT = 'bord'; boardEl.classList.add('compact'); }
    if (k.profiler){ PROFILE = getProfile(); setupProfiles(); }
    if (k.varianter){ setupChooser(k, list, systems); return null; }
    if (k.viden) $('source').innerHTML = `Aftalerne står i <a href="${k.viden}">${ids.length > 1 ? 'systemdokumentet' : sys && sys.id === 'kamp' ? 'referencelaget Kampen om kontrakten' : sys ? 'systemet for ' + sys.navn : 'vores system'}</a>.`;
    return fetch(`pools/${k.id}.json`).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  })
  .then(pool => { if (pool){ POOL = pool; startRound(); } })
  .catch(e => fail(e.message === 'ukendt'
    ? 'Den konvention findes ikke – eller den er ikke klar endnu.'
    : 'Kunne ikke hente hånd-puljen. Åbn siden via GitHub Pages eller en lokal webserver — ikke direkte som fil.'));
</script>
</body>
</html>
