<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viden — Konventionstræner</title>
<meta name="description" content="Vores bridgeaftaler og notater.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;0,800;1,400&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Symbols+2&text=%E2%99%A0%E2%99%A5%E2%99%A6%E2%99%A3&display=swap">
<link rel="stylesheet" href="../assets/site.css">
</head>
<body>
<header class="site-head"><div class="in">
  <a class="brand" href="../">Konventionstræner</a>
  <nav><a href="../#traen">Træn</a><a href="./" aria-current="page">Viden</a></nav>
</div></header>
<div class="wrap">
  <section class="hero">
    <p class="eyebrow">Viden</p>
    <h1>Aftaler og notater</h1>
    <p class="deck">Vores systembeskrivelse og de notater, trænerens facit bygger på.</p>
  </section>
  <div class="tiles" id="docs"></div>
</div>
<script>
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c])); }
fetch('../data/viden.json').then(r => r.json()).then(list => {
  document.getElementById('docs').innerHTML = list.map(d =>
    `<a class="tile" href="../${esc(d.href)}"><div class="grp">${esc(d.type)}</div><h3>${esc(d.titel)}</h3><p>${esc(d.beskrivelse)}</p></a>`).join('');
}).catch(() => {
  document.getElementById('docs').innerHTML = '<p class="small">Kunne ikke hente listen. Åbn siden via GitHub Pages eller en lokal webserver.</p>';
});
</script>
</body>
</html>
