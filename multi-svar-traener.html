<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Svar på doblingen — Multitræner</title>
<link rel="canonical" href="https://www.kontraktbridge.dk/konventionstraener/multi-svar-traener.html">
<link rel="stylesheet" href="assets/fonts/tekst.css">
<link rel="stylesheet" href="assets/subtle-gradient.css">
<script src="assets/lang.js"></script>

<style>
  :root {
    /* Light — "on paper": the system card's own cream and navy */
    --bg: #EFE9DA;
    --bg-2: #E4DCC5;
    --card: #FFFFFF;
    --card-ink: #1F2A33;
    --ink: #1F2A33;
    --ink-dim: #5B6B70;
    --gold: #9C7A2E;
    --gold-dim: #7C5F22;
    --black-suit: #1F2A33;
    --red-suit: #BA2430;
    --good: #2E7D46;
    --good-bg: #E4F2E7;
    --good-ink: #1F4A2D;
    --bad: #B0212F;
    --bad-bg: #FBEAE8;
    --bad-ink: #5C1620;
    --line-soft: rgba(31,42,51,0.14);
    --box-cell: #FBF9F3;
    --box-cell-off: #EFE9DA;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100%;
    background: var(--bg) radial-gradient(1200px 800px at 50% -10%, var(--bg-2), var(--bg));
    color: var(--ink); font-family: 'Inter', system-ui, sans-serif;
    display: flex; justify-content: center;
    padding: 28px 14px calc(48px + env(safe-area-inset-bottom, 0px));
  }
  .wrap { width: 100%; max-width: 620px; }

  .brand { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; gap: 12px; flex-wrap: wrap; }
  .brand .name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 15px; letter-spacing: 0.08em; color: var(--gold); text-transform: uppercase; }
  .brand .part { font-size: 13px; color: var(--ink-dim); }

  h1 { font-family: 'Fraunces', serif; font-weight: 700; font-size: clamp(26px, 6vw, 36px); line-height: 1.08; margin: 0 0 6px; letter-spacing: -0.01em; }
  .sub { color: var(--ink-dim); font-size: 14.5px; line-height: 1.5; margin: 0 0 22px; max-width: 50ch; }

  .progress { display: flex; gap: 6px; margin-bottom: 20px; }
  .progress i { flex: 1; height: 4px; border-radius: 2px; background: var(--line-soft); overflow: hidden; position: relative; }
  .progress i.done::after, .progress i.current::after { content: ""; position: absolute; inset: 0; background: var(--gold); }
  .progress i.wrong::after { background: var(--bad); }

  .table { background: linear-gradient(180deg, var(--bg-2), var(--bg)); border: 1px solid rgba(199,154,63,0.28); border-radius: 18px; padding: 24px 20px 20px; box-shadow: 0 20px 50px -24px rgba(0,0,0,0.6); }

  /* Auction strip */
  .auction { display: flex; gap: 22px; margin-bottom: 20px; align-items: flex-end; }
  .auction .slot { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .auction .who { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-dim); }
  .bidcard {
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 17px;
    background: var(--card); color: var(--card-ink);
    border: 1px solid rgba(0,0,0,0.14); border-radius: 6px;
    min-width: 46px; padding: 8px 4px 7px; text-align: center;
    box-shadow: 0 4px 10px -6px rgba(0,0,0,0.5);
  }
  .bidcard.them { opacity: 0.68; }
  .bidcard .r { color: var(--red-suit); }
  .bidcard .k { color: var(--black-suit); }
  .bidcard .x { color: var(--red-suit); }
  .ctx { width:100%; font-size:12.5px; color:var(--ink-dim); margin-bottom:-8px; }
  .auction { flex-wrap: wrap; }
  .arrow { color: var(--ink-dim); font-size: 15px; margin-bottom: 10px; }

  .toprow { display: flex; gap: 14px; align-items: stretch; margin-bottom: 18px; flex-wrap: wrap; }

  .hand { background: var(--card); color: var(--card-ink); border-radius: 12px; padding: 14px 16px; display: grid; gap: 5px; align-content: start; box-shadow: 0 10px 24px -14px rgba(0,0,0,0.55); flex: 1 1 200px; max-width: 260px; }
  .hand .row { display: flex; gap: 10px; font-size: 17px; font-weight: 600; align-items: baseline; }
  .hand .suit { width: 20px; flex: none; font-size: 18px; }
  .hand .black { color: var(--black-suit); }
  .hand .red { color: var(--red-suit); }

  .qrow { display: flex; align-items: center; justify-content: space-between; margin: 0 0 10px; gap: 10px; }
  .qtext { font-size: 14.5px; font-weight: 500; margin: 0; }
  .hint-btn {
    background: transparent; border: 1px solid var(--line-soft); color: var(--gold);
    border-radius: 999px; width: 34px; height: 34px; font-size: 16px; cursor: pointer;
    flex: none; display: flex; align-items: center; justify-content: center;
  }
  .hint-btn:hover { border-color: var(--gold); }
  .hint-btn[aria-pressed="true"] { background: var(--gold); color: #23180A; }
  .hintinfo {
    font-size: 13px; color: var(--gold-dim); background: rgba(156,122,46,0.1);
    border: 1px solid rgba(199,154,63,0.3); border-radius: 8px;
    padding: 7px 12px; margin: -2px 0 12px; display: none;
  }
  .hintinfo.show { display: block; }

  .bonus {
    flex: 1 1 220px;
    background: rgba(156,122,46,0.08);
    border: 1px solid rgba(199,154,63,0.35);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .bonus .label {
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 12px;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--gold);
    margin: 0 0 8px;
  }
  .bonus .bq { font-size: 13.5px; margin: 0 0 10px; line-height: 1.4; }
  .bonus .opts { display: grid; gap: 7px; }
  .bopt {
    font-family: 'Inter', sans-serif; font-size: 13px; text-align: left;
    background: var(--card); color: var(--card-ink); border: 1px solid rgba(0,0,0,0.12);
    border-radius: 8px; padding: 9px 11px; cursor: pointer;
  }
  .bopt:hover:not(:disabled) { border-color: var(--gold); }
  .bopt:disabled { cursor: default; }
  .bopt.correct { background: var(--good-bg); border-color: var(--good); color: var(--good-ink); }
  .bopt.incorrect { background: var(--bad-bg); border-color: var(--bad); color: var(--bad-ink); }
  .bonus .bfeedback { margin-top: 10px; font-size: 13px; line-height: 1.5; color: var(--ink-dim); display: none; }
  .bonus .bfeedback.show { display: block; }

  /* Bidding box */
  .box { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 6px; }
  .cell {
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 13px;
    background: var(--box-cell); color: var(--card-ink);
    border: 1px solid rgba(0,0,0,0.1); border-radius: 5px;
    padding: 6px 2px; text-align: center; cursor: pointer;
    transition: transform .1s ease, box-shadow .1s ease, outline .1s ease;
  }
  .cell .r { color: var(--red-suit); } .cell .k { color: var(--black-suit); }
  .cell:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 12px -8px rgba(0,0,0,0.5); }
  .cell:disabled { background: var(--box-cell-off); color: var(--ink-dim); opacity: 0.45; cursor: default; }
  .cell.hinted:not(:disabled) { outline: 2px solid var(--gold); outline-offset: 1px; }
  .cell.correct { background: var(--good-bg); outline: 2px solid var(--good); color: var(--good-ink); opacity: 1; }
  .cell.incorrect { background: var(--bad-bg); outline: 2px solid var(--bad); color: var(--bad-ink); opacity: 1; }
  .specialrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 10px; }

  .feedback { margin-top: 14px; padding: 13px 15px; border-radius: 10px; font-size: 14px; line-height: 1.55; display: none; }
  .feedback.show { display: block; }
  .feedback.ok { background: var(--good-bg); color: var(--good-ink); }
  .feedback.no { background: var(--bad-bg); color: var(--bad-ink); }
  .feedback b { display: block; margin-bottom: 4px; }

  .next { margin-top: 14px; display: none; width: 100%; background: var(--gold); color: #23180A; border: none; border-radius: 10px; padding: 13px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14.5px; cursor: pointer; }
  .next:hover { background: #D6AB52; }
  .next.show { display: block; }

  .done { text-align: center; padding: 10px 4px 4px; }
  .done .score { font-family: 'Fraunces', serif; font-size: 46px; font-weight: 700; color: var(--gold); margin: 6px 0; }
  .done p { color: var(--ink-dim); font-size: 14.5px; margin: 0 0 20px; }
  .restart { background: transparent; color: var(--ink); border: 1px solid var(--line-soft); border-radius: 10px; padding: 12px 20px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px; cursor: pointer; }
  .restart:hover { border-color: var(--gold); color: var(--gold); }

  @media (max-width: 420px) {
    .cell { font-size: 12px; padding: 6px 1px; }
  }

  /* Subtle Gradient-laget (assets/subtle-gradient.css) */
  :root{ --bg:var(--sg-canvas-soft); --bg-2:var(--sg-canvas-soft); --card:var(--sg-canvas); --card-ink:var(--sg-ink); --ink:var(--sg-ink); --ink-dim:var(--sg-body);
         --gold:var(--sg-ink); --gold-dim:var(--sg-body); --black-suit:var(--suit-black); --red-suit:var(--suit-red);
         --good:var(--sg-positive-deep); --good-bg:var(--sg-primary-pale); --good-ink:var(--sg-positive-deep);
         --bad:var(--sg-negative-deep); --bad-bg:var(--sg-canvas-soft); --bad-ink:var(--sg-ink);
         --line-soft:var(--sg-hairline); --box-cell:var(--sg-canvas-soft); --box-cell-off:var(--sg-canvas-soft); }
  body{ background:var(--sg-canvas-soft); font-family:var(--sg-sans); }
  .brand .name{ font-family:var(--sg-display); font-weight:800; font-size:1.1rem; letter-spacing:-.01em; text-transform:none; color:var(--sg-ink); }
  .brand .part{ color:var(--sg-body); }
  h1{ font-family:var(--sg-display); font-weight:800; letter-spacing:-.025em; line-height:1; }
  .sub{ color:var(--sg-body); }
  .progress i{ height:6px; border-radius:var(--sg-radius-pill); }
  .progress i.done::after, .progress i.current::after{ background:var(--sg-primary); }
  .progress i.wrong::after{ background:var(--sg-negative-deep); }
  .table{ background:var(--sg-canvas); border:0; border-radius:var(--sg-radius-xl); box-shadow:none; padding:var(--sg-space-xl); }
  .bidcard{ font-family:var(--sg-sans); font-weight:600; border:1px solid var(--sg-hairline); border-radius:var(--sg-radius-sm); box-shadow:none; }
  .bidcard .x{ color:var(--bid-dbl); }
  .bidcard .xx{ color:var(--bid-rdbl); }
  .hand{ background:var(--sg-canvas-soft); box-shadow:none; border-radius:var(--sg-radius-lg); }
  .hint-btn{ background:var(--sg-canvas-soft); border:0; color:var(--sg-ink); width:40px; height:40px; }
  .hint-btn:hover{ box-shadow:inset 0 0 0 1px var(--sg-ink); }
  .hint-btn[aria-pressed="true"]{ background:var(--sg-primary); color:var(--sg-on-primary); }
  .hintinfo{ background:var(--sg-primary-pale); border:0; border-radius:var(--sg-radius-md); color:var(--sg-ink); font-weight:600; font-size:14px; }
  .bonus{ background:var(--sg-canvas-soft); border:0; border-radius:var(--sg-radius-lg); }
  .bonus .label{ font-family:var(--sg-sans); font-weight:600; letter-spacing:0; text-transform:none; color:var(--sg-body); }
  .bopt{ background:var(--sg-canvas); border:0; border-radius:var(--sg-radius-md); padding:12px 16px; }
  .bopt:hover:not(:disabled){ box-shadow:inset 0 0 0 1px var(--sg-ink); }
  .bopt.correct{ background:var(--sg-primary-pale); color:var(--sg-positive-deep); box-shadow:inset 0 0 0 2px var(--sg-positive-deep); }
  .bopt.incorrect{ background:var(--sg-canvas); color:var(--sg-negative-deep); box-shadow:inset 0 0 0 2px var(--sg-negative-deep); }
  .cell{ font-family:var(--sg-sans); font-weight:600; background:var(--sg-canvas-soft); border:0; border-radius:var(--sg-radius-sm); padding:8px 2px; transition:none; }
  .cell:hover:not(:disabled){ transform:none; box-shadow:inset 0 0 0 1px var(--sg-ink); }
  .cell:disabled{ background:var(--sg-canvas-soft); opacity:.35; }
  .cell.hinted:not(:disabled){ outline:0; background:var(--sg-primary-pale); box-shadow:inset 0 0 0 2px var(--sg-ink); }
  .cell.correct{ outline:0; background:var(--sg-primary-pale); color:var(--sg-positive-deep); box-shadow:inset 0 0 0 2px var(--sg-positive-deep); }
  .cell.incorrect{ outline:0; background:var(--sg-canvas); color:var(--sg-negative-deep); box-shadow:inset 0 0 0 2px var(--sg-negative-deep); }
  .feedback{ border-radius:var(--sg-radius-lg); }
  .feedback.ok b{ color:var(--sg-positive-deep); } .feedback.no b{ color:var(--sg-negative-deep); }
  .next{ background:var(--sg-primary); color:var(--sg-on-primary); border-radius:var(--sg-radius-xl); font-weight:600; font-size:16px; padding:12px 24px; }
  .next:hover{ background:var(--sg-primary-active); }
  .done .score{ font-family:var(--sg-display); font-weight:800; color:var(--sg-ink); }
  .restart{ background:var(--sg-canvas-soft); border:0; border-radius:var(--sg-radius-xl); }
  .restart:hover{ color:var(--sg-ink); box-shadow:inset 0 0 0 1px var(--sg-ink); }

  /* Topbjælken og sidefoden (SPEC-traen-side.md): siden står i en kolonne under den fuldbrede topbjælke,
     og sidefoden står under træneren */
  body{ flex-direction:column; justify-content:flex-start; align-items:center; padding:0 0 calc(48px + env(safe-area-inset-bottom, 0px)); }
  #topbjaelke, #sidefod{ align-self:stretch; }
  .wrap{ box-sizing:border-box; padding:28px 14px 0; }
</style>

document.title = T('Svar på doblingen — Multitræner', 'Responding to partner — Multi trainer');
const STRAINS = ['♣','♦','♥','♠','NT'];
/** Honnørerne: E K D B på dansk, A K Q J på engelsk. */
const cards = (c) => T(c, c.replace(/\b[EDB]\b/g, (h) => ({ E: 'A', D: 'Q', B: 'J' })[h]));
/** Meldingens tekst: Pas hedder Pass på engelsk; id'et er det samme. */
const label = (call) => call === 'Pas' ? W('Pas') : call;
function suitClass(s){ return (s === '♥' || s === '♦') ? 'red' : 'black'; }
function rank(level, strainIdx){ return level*5 + strainIdx; }
function parseCall(call){
  if (call === 'Pas' || call === 'X' || call === 'XX') return null;
  const level = parseInt(call[0],10);
  const strain = call.slice(1);
  return { level, strain, idx: STRAINS.indexOf(strain) };
}
function callRank(call){
  const p = parseCall(call);
  return p ? rank(p.level, p.idx) : -1;
}

let idx = 0, score = 0, answered = false, results = [], hintOn = false;

const progressEl = document.getElementById('progress');
const auctionEl = document.getElementById('auction');
const handEl = document.getElementById('hand');
const boxEl = document.getElementById('box');
const specialEl = document.getElementById('special');
const feedbackEl = document.getElementById('feedback');
const nextBtn = document.getElementById('nextBtn');
const hintBtn = document.getElementById('hintBtn');
const tableEl = document.querySelector('.table');

function fmtCall(call){
  if (call === 'X' || call === 'XX') return `<span class="${call === 'XX' ? 'xx' : 'x'}">${call}</span>`;
  if (call === 'Pas') return label(call);
  const p = parseCall(call);
  const cls = suitClass(p.strain) === 'red' ? 'r' : 'k';
  const strainHtml = p.strain === 'NT' ? '<span class="k">NT</span>' : `<span class="${cls}">${p.strain}</span>`;
  return `${p.level}${strainHtml}`;
}

function renderProgress(){
  progressEl.innerHTML = '';
  for (let i = 0; i < Q.length; i++){
    const el = document.createElement('i');
    if (i < results.length) el.className = results[i] ? 'done' : 'done wrong';
    else if (i === idx) el.className = 'current';
    progressEl.appendChild(el);
  }
}

function renderAuction(q){
  auctionEl.innerHTML = (q.ctx ? `<div class="ctx">${q.ctx}</div>` : '') + `
    <div class="slot"><span class="who">${W('Modstander')}</span><div class="bidcard them">${fmtCall(q.theirBid)}</div></div>
    <span class="arrow">→</span>
    <div class="slot"><span class="who">${W('Makker')}</span><div class="bidcard">${fmtCall(q.partnerBid)}</div></div>
    <span class="arrow">→</span>
    <div class="slot"><span class="who">${W('Dig')}</span><div class="bidcard" style="opacity:.35;">?</div></div>
  `;
}

function render(){
  answered = false; hintOn = false;
  hintBtn.setAttribute('aria-pressed','false');
  const q = Q[idx];
  renderProgress();
  renderAuction(q);
  handEl.innerHTML = q.hand.map(([s,c]) => `<div class="row"><span class="suit ${suitClass(s)}">${s}</span><span>${cards(c)}</span></div>`).join('');

  document.getElementById('hintInfo').className = 'hintinfo';

  boxEl.innerHTML = '';
  for (let lvl = 1; lvl <= 7; lvl++){
    STRAINS.forEach((s, sIdx) => {
      const call = lvl + s;
      const btn = document.createElement('button');
      btn.className = 'cell';
      btn.innerHTML = fmtCall(call);
      const legal = rank(lvl, sIdx) >= q.lowest;
      btn.disabled = !legal;
      if (legal) btn.addEventListener('click', () => choose(call, btn));
      boxEl.appendChild(btn);
    });
  }
  specialEl.innerHTML = '';
  ['Pas','X','XX'].forEach(call => {
    const btn = document.createElement('button');
    btn.className = 'cell';
    btn.dataset.call = call;
    btn.textContent = label(call);
    if (call !== 'Pas'){ btn.disabled = true; }
    else btn.addEventListener('click', () => choose(call, btn));
    specialEl.appendChild(btn);
  });

  feedbackEl.className = 'feedback';
  feedbackEl.innerHTML = '';
  nextBtn.className = 'next';

  // bonus question — visible from the start, next to the hand
  const bonusEl = document.getElementById('bonus');
  document.getElementById('bonusQ').textContent = q.bonus.q;
  const bOptsEl = document.getElementById('bonusOpts');
  bOptsEl.innerHTML = '';
  q.bonus.options.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'bopt';
    b.textContent = opt;
    b.addEventListener('click', () => chooseBonus(opt, b));
    bOptsEl.appendChild(b);
  });
  document.getElementById('bonusFeedback').className = 'bfeedback';
  document.getElementById('bonusFeedback').textContent = '';
}

hintBtn.addEventListener('click', () => {
  if (answered) return;
  hintOn = !hintOn;
  hintBtn.setAttribute('aria-pressed', hintOn ? 'true' : 'false');
  const q = Q[idx];
  const infoEl = document.getElementById('hintInfo');
  [...boxEl.children, ...specialEl.children].forEach(b => b.classList.remove('hinted'));
  if (hintOn){
    [...boxEl.children].forEach((b, i) => {
      const lvl = Math.floor(i/5) + 1, sIdx = i % 5, call = lvl + STRAINS[sIdx];
      if (q.hints.includes(call)) b.classList.add('hinted');
    });
    [...specialEl.children].forEach(b => { if (q.hints.includes(b.dataset.call)) b.classList.add('hinted'); });
    infoEl.textContent = T(`Din hånd: ${q.hp} hp / ${q.sp} sp`, `Your hand: ${q.hp} HCP / ${q.sp} support points`);
    infoEl.className = 'hintinfo show';
  } else {
    infoEl.className = 'hintinfo';
  }
});

function choose(call, btn){
  if (answered) return;
  answered = true;
  const q = Q[idx];
  const isCorrect = call === q.correct;
  results[idx] = isCorrect;
  if (isCorrect) score++;

  [...boxEl.children, ...specialEl.children].forEach((b, i) => {
    let bCall;
    if (b.parentElement === boxEl){ const lvl = Math.floor(i/5)+1, sIdx = i%5; bCall = lvl+STRAINS[sIdx]; }
    else bCall = b.dataset.call;
    if (bCall === q.correct) b.classList.add('correct');
    if (!b.disabled) b.disabled = true;
  });
  if (!isCorrect) btn.classList.add('incorrect');

  feedbackEl.className = 'feedback show ' + (isCorrect ? 'ok' : 'no');
  feedbackEl.innerHTML = `<b>${isCorrect ? T('Rigtigt — ', 'Right — ') + label(q.correct) : T('Facit: ', 'Answer: ') + label(q.correct)}</b>${q.why}`;
  nextBtn.className = 'next show';
  nextBtn.textContent = idx === Q.length - 1 ? T('Se resultat →', 'See the result →') : T('Næste hånd →', 'Next hand →');
  renderProgress();
}

function chooseBonus(opt, btn){
  const q = Q[idx];
  const opts = [...document.getElementById('bonusOpts').children];
  if (opts[0].disabled) return; // already answered
  const isCorrect = opt === q.bonus.correct;
  opts.forEach(b => {
    b.disabled = true;
    if (b.textContent === q.bonus.correct) b.classList.add('correct');
  });
  if (!isCorrect) btn.classList.add('incorrect');
  const bf = document.getElementById('bonusFeedback');
  bf.className = 'bfeedback show';
  bf.textContent = q.bonus.why;
}

nextBtn.addEventListener('click', () => {
  idx++;
  if (idx >= Q.length){ renderDone(); return; }
  render();
});

function renderDone(){
  tableEl.innerHTML = `
    <div class="done">
      <p class="qtext" style="margin-bottom:0;">${T('Du klarede', 'You got')}</p>
      <div class="score">${score} / ${Q.length}</div>
      <p>${score === Q.length ? T('Hele svarstrukturen sidder.', 'The whole structure has stuck.') : T('Du kan gennemgå forklaringerne igen og prøve en gang til.', 'You can go through the explanations again and have another go.')}</p>
      <button class="restart" id="restartBtn">${T('Forfra', 'Start over')}</button>
    </div>`;
  document.getElementById('restartBtn').addEventListener('click', () => location.reload());
}

// "Senest trænet" på forsiden: multitræneren står som Multiforsvar mod 1NT (SPEC-traen-side.md, Afklaret punkt 2)
try {
  const a = JSON.parse(localStorage.getItem('senest') || '[]');
  localStorage.setItem('senest', JSON.stringify(['multiforsvar'].concat(Array.isArray(a) ? a.filter(x => x !== 'multiforsvar') : []).slice(0, 3)));
} catch (e) {}
render();
